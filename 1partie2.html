*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:'Trebuchet MS','Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
#tv{position:relative;width:100vw;height:100vh;max-width:900px;max-height:100vh;background:#000;overflow:hidden}
.scene{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1s}
.scene.on{opacity:1}
#chapitre{position:absolute;top:14px;left:16px;color:#ffd54a;font-size:13px;letter-spacing:2px;text-shadow:0 1px 6px #000;z-index:30;opacity:.9}
#pausebtn{position:absolute;top:10px;right:14px;z-index:35;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:50%;width:40px;height:40px;font-size:16px;cursor:pointer}
#soustitre{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:90%;max-width:760px;text-align:center;color:#fff;font-size:clamp(15px,4.4vw,24px);text-shadow:0 2px 10px #000,0 0 24px #000;line-height:1.4;z-index:30;opacity:0;transition:opacity .5s}
#soustitre.on{opacity:1}
#barre{position:absolute;bottom:0;left:0;height:5px;background:linear-gradient(90deg,#ffd54a,#4affd4);width:0;z-index:30;transition:width .3s linear}
.ecran{position:absolute;inset:0;z-index:40;background:radial-gradient(circle at 50% 38%,#16303a,#050810);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#accueil .saison{color:#8afff0;letter-spacing:4px;font-size:14px;margin-bottom:12px}
#accueil h1{color:#ffd54a;font-size:clamp(26px,7vw,46px);text-shadow:0 0 24px #ffd54a;margin-bottom:8px}
#accueil h2{color:#d8f5ff;font-size:clamp(16px,4.5vw,24px);font-weight:normal;margin-bottom:22px}
#accueil .duree{color:#7a9aa0;font-size:14px;margin-bottom:30px}
.btn{background:linear-gradient(135deg,#ffd54a,#ff9a3a);color:#2d1b4e;border:none;padding:16px 48px;border-radius:40px;font-size:21px;font-weight:bold;cursor:pointer;box-shadow:0 6px 26px rgba(255,150,60,.5);transition:transform .15s}
.btn:active{transform:scale(.94)}
#fin{display:none}
#fin h1{color:#ffd54a;font-size:clamp(24px,6vw,40px);text-shadow:0 0 24px #ffd54a;margin-bottom:16px}
#fin p{color:#d8f5ff;font-size:clamp(15px,4vw,19px);line-height:1.55;margin-bottom:28px}
.btn.viol{background:linear-gradient(135deg,#8afff0,#4a9adf);color:#06202a}

<div id="chapitre"></div>

<div id="soustitre"></div>

<div class="ecran" id="accueil">
  <div class="saison">ÉTINCELLE · LE FILM</div>
  <h1>L'Étoile Originelle</h1>
  <h2>Partie 2 — Le Givre de la première nuit</h2>
  <div class="duree">⭐ ~20 minutes · Film en 3 parties</div>
  <button class="btn" id="play">▶ Regarder</button>
</div>
<div class="ecran" id="fin">
  <h1>Fin de la Partie 2</h1>
  <p>Le Givre a fui, rongé par sa peine...<br>La vérité éclatera dans la grande Partie 3 finale !</p>
  <button class="btn viol" id="rejouer">↻ Revoir la Partie 2</button>
</div>
</div>
<script>
const FILM = [
 {id:'a1', dur:60, subs:[
   [2,"La créature turquoise flottait devant Étincelle."],
   [15,"Ni ombre, ni lumière : quelque chose de glacé."],
   [28,"« Qui es-tu ? » demanda Étincelle, sur ses gardes."],
   [40,"« Je suis le Givre. Le froid de la première nuit. »"],
   [52,"Sa voix claquait comme de la glace qui se brise."]]},
 {id:'a2', dur:60, subs:[
   [2,"« Avant toi, il n'y avait que moi », dit le Givre."],
   [14,"« Le noir, le silence, le froid éternel. »"],
   [27,"« Puis tu es née, et tout a changé. »"],
   [39,"« Ta lumière m'a chassé aux confins du monde. »"],
   [51,"« J'ai attendu si longtemps pour revenir. »"]]},
 {id:'a3', dur:60, subs:[
   [2,"D'un geste, le Givre figea l'air autour de lui."],
   [14,"Des cristaux de glace se formèrent en flottant."],
   [27,"« Je vais rendre au monde son silence d'origine. »"],
   [40,"« Plus de lumière. Plus de chaleur. Plus rien. »"],
   [52,"Étincelle frissonna, mais ne bougea pas."]]},
 {id:'a4', dur:60, subs:[
   [3,"Un souvenir remonta à la mémoire d'Étincelle."],
   [16,"La première nuit... elle n'était pas seule, finalement."],
   [29,"Quand elle avait allumé la première étoile,"],
   [42,"le froid qui régnait avait été repoussé."],
   [53,"Ce froid... c'était lui. Le Givre."]]},
 {id:'a5', dur:60, subs:[
   [2,"Dans le souvenir, la petite étoile brillait."],
   [15,"Et le Givre reculait, blessé par la chaleur."],
   [28,"Il n'était pas méchant, au début : juste seul."],
   [40,"Mais la solitude l'avait rendu amer et glacé."],
   [52,"Étincelle comprit : elle l'avait chassé sans le vouloir."]]},
 {id:'a6', dur:60, subs:[
   [2,"« Alors c'est ma faute si tu es devenu ça ? »"],
   [14,"Le Givre eut un rire cassant et cruel."],
   [26,"« Trop tard pour les regrets, petite étoile. »"],
   [38,"« Cette fois, c'est TA lumière qui s'éteindra. »"],
   [51,"Il déferla sur la ville comme une tempête de glace."]]},
 {id:'a7', dur:60, subs:[
   [2,"En un instant, la ville entière se couvrit de givre."],
   [15,"Les toits gelèrent, les fenêtres se figèrent."],
   [28,"Le froid mordait, terrible, implacable."],
   [40,"« Il faut protéger les gens ! » cria Étincelle."],
   [52,"Elle s'élança à travers les rues gelées."]]},
 {id:'a8', dur:60, subs:[
   [2,"Ses amis la rejoignirent aussitôt."],
   [13,"Lueur réchauffait l'air de sa lueur mauve."],
   [25,"Le chat guidait les habitants vers l'abri."],
   [37,"Hulotte survolait la ville pour repérer le Givre."],
   [50,"Ensemble, ils tenaient bon contre le froid."]]},
 {id:'a9', dur:60, subs:[
   [2,"Mais le Givre était partout à la fois."],
   [14,"Chaque fois qu'ils réchauffaient un endroit,"],
   [26,"il en gelait un autre, encore plus fort."],
   [38,"« On n'y arrivera pas comme ça ! » haleta Lueur."],
   [51,"Étincelle réfléchissait à toute vitesse."]]},
 {id:'a10', dur:60, subs:[
   [2,"Alors Étincelle brilla de toutes ses forces."],
   [14,"Une vague de chaleur dorée balaya les rues."],
   [26,"Le givre fondit, l'espace d'un instant."],
   [38,"Les habitants purent se mettre à l'abri."],
   [50,"Mais Étincelle, épuisée, faiblissait déjà."]]},
 {id:'a11', dur:60, subs:[
   [2,"Le Givre en profita pour frapper."],
   [13,"Un rayon glacé fila droit sur Étincelle !"],
   [25,"Elle l'esquiva de justesse, le souffle court."],
   [37,"« Tu t'épuises, petite étoile », ricana le Givre."],
   [50,"« Bientôt, tu n'auras plus rien à donner. »"]]},
 {id:'a12', dur:60, subs:[
   [2,"C'était vrai : plus elle brillait, plus elle faiblissait."],
   [15,"Le combat frontal ne menait à rien."],
   [27,"« La force ne suffira pas », comprit-elle."],
   [39,"Elle se souvint des mots de la Première Lumière :"],
   [51,"« On ne combat pas le froid... on le réchauffe. »"]]},
 {id:'a13', dur:60, subs:[
   [2,"Étincelle cessa alors de vouloir le vaincre."],
   [14,"Au lieu d'attaquer, elle s'approcha, douce."],
   [26,"« Je sais ce que c'est, d'avoir peur du noir. »"],
   [39,"« Je sais aussi ce que c'est, d'être seul. »"],
   [51,"Le Givre hésita, décontenancé."]]},
 {id:'a14', dur:60, subs:[
   [2,"« Menteuse ! » gronda le Givre, furieux."],
   [13,"« Personne n'a jamais rien compris à ma peine ! »"],
   [26,"Il grandit, immense, dressé au-dessus d'elle."],
   [38,"« Je vais tout geler, à commencer par TOI ! »"],
   [51,"Étincelle leva les yeux, sans reculer."]]},
 {id:'a15', dur:60, subs:[
   [3,"Elle plongea une dernière fois dans ses souvenirs."],
   [16,"La première nuit, quand elle était bébé étoile..."],
   [29,"...il y avait bien eu un instant de paix."],
   [41,"Un instant où sa lumière et le froid coexistaient."],
   [53,"Avant qu'elle ne le repousse par peur."]]},
 {id:'a16', dur:60, subs:[
   [2,"Dans ce souvenir, deux lueurs brillaient côte à côte :"],
   [14,"la sienne, dorée, et une autre... turquoise."],
   [27,"Le Givre aussi avait été une lumière, autrefois."],
   [40,"Une étoile de glace, belle et scintillante."],
   [52,"Avant que la solitude ne l'éteigne."]]},
 {id:'a17', dur:60, subs:[
   [2,"Étincelle rouvrit les yeux, pleine d'une idée."],
   [14,"« Tu n'es pas qu'un monstre de froid », dit-elle."],
   [27,"« Tu étais une étoile, toi aussi. Je m'en souviens. »"],
   [40,"Le Givre se figea, ébranlé par ces mots."],
   [52,"« ...Comment peux-tu savoir ça ? »"]]},
 {id:'a18', dur:60, subs:[
   [2,"« Parce qu'on est nés la même nuit », dit Étincelle."],
   [14,"« Toi et moi, la lumière et le froid. »"],
   [27,"« Je n'aurais jamais dû te repousser. Pardon. »"],
   [40,"Pour la première fois, le Givre trembla... d'émotion."],
   [52,"Un mince éclat turquoise vacilla en lui."]]},
 {id:'a19', dur:60, subs:[
   [2,"Mais la colère du Givre était trop ancienne."],
   [14,"« C'est trop tard ! » hurla-t-il, déchiré."],
   [26,"Sa peine explosa en une tempête aveuglante."],
   [38,"Étincelle et ses amis furent projetés au loin."],
   [50,"Quand la lumière revint... le Givre avait disparu."]]},
 {id:'a20', dur:60, subs:[
   [2,"Étincelle se releva, le cœur serré."],
   [14,"Le Givre n'était pas vaincu. Il était en fuite."],
   [26,"« Il souffre. Et je crois savoir pourquoi », dit-elle."],
   [38,"« Pour l'arrêter, je dois comprendre notre passé. »"],
   [48,"« Jusqu'au bout. »"],
   [56,"FIN DE LA PARTIE 2"]]}
];
const scenes = FILM.map(s=>document.getElementById(s.id));
const stEl=document.getElementById('soustitre'), chEl=document.getElementById('chapitre'), barre=document.getElementById('barre');
const total=FILM.reduce((a,s)=>a+s.dur,0);
let idx=0,t=0,timer=null,pause=false;
function tic(){
  const sc=FILM[idx];
  scenes.forEach((el,i)=>el.classList.toggle('on',i===idx));
  chEl.textContent='CHAPITRE '+(idx+1)+' / '+FILM.length;
  let cur=''; for(const [ts,txt] of sc.subs){ if(t>=ts) cur=txt; }
  if(stEl.textContent!==cur){ stEl.textContent=cur; stEl.classList.remove('on'); void stEl.offsetWidth; stEl.classList.add('on'); }
  let ec=0; for(let i=0;i<idx;i++) ec+=FILM[i].dur; ec+=t;
  barre.style.width=(ec/total*100)+'%';
  t++;
  if(t>=sc.dur){ t=0; idx++; if(idx>=FILM.length){ fin(); return; } }
}
function demarrer(){ document.getElementById('accueil').style.display='none'; document.getElementById('fin').style.display='none'; idx=0;t=0;pause=false; clearInterval(timer); timer=setInterval(()=>{if(!pause)tic();},1000); tic(); }
function fin(){ clearInterval(timer); document.getElementById('fin').style.display='flex'; }
document.getElementById('play').onclick=demarrer;
document.getElementById('rejouer').onclick=demarrer;
document.getElementById('pausebtn').onclick=function(){ pause=!pause; this.textContent=pause?'▶':'⏸'; };
</script>
</body></html>
