html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:'Trebuchet MS','Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
#tv{position:relative;width:100vw;height:100vh;max-width:900px;max-height:100vh;background:#000;overflow:hidden}
.scene{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1s}
.scene.on{opacity:1}
#chapitre{position:absolute;top:14px;left:16px;color:#ffd54a;font-size:13px;letter-spacing:2px;text-shadow:0 1px 6px #000;z-index:30;opacity:.9}
#pausebtn{position:absolute;top:10px;right:14px;z-index:35;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:50%;width:40px;height:40px;font-size:16px;cursor:pointer}

#soustitre.on{opacity:1}
#barre{position:absolute;bottom:0;left:0;height:5px;background:linear-gradient(90deg,#ffd54a,#c79cff);width:0;z-index:30;transition:width .3s linear}
.ecran{position:absolute;inset:0;z-index:40;background:radial-gradient(circle at 50% 38%,#2d1b4e,#080820);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#accueil .saison{color:#c79cff;letter-spacing:4px;font-size:14px;margin-bottom:12px}
#accueil h1{color:#ffd54a;font-size:clamp(26px,7vw,46px);text-shadow:0 0 24px #ffd54a;margin-bottom:8px}
#accueil h2{color:#f0d8ff;font-size:clamp(16px,4.5vw,24px);font-weight:normal;margin-bottom:22px}
#accueil .duree{color:#9a8ac0;font-size:14px;margin-bottom:30px}
.btn{background:linear-gradient(135deg,#ffd54a,#ff9a3a);color:#2d1b4e;border:none;padding:16px 48px;border-radius:40px;font-size:21px;font-weight:bold;cursor:pointer;box-shadow:0 6px 26px rgba(255,150,60,.5);transition:transform .15s}
.btn:active{transform:scale(.94)}
#fin{display:none}
#fin h1{color:#ffd54a;font-size:clamp(24px,6vw,40px);text-shadow:0 0 24px #ffd54a;margin-bottom:16px}
#fin p{color:#f0d8ff;font-size:clamp(15px,4vw,19px);line-height:1.55;margin-bottom:28px}

<div id="chapitre"></div>
<button id="pausebtn">⏸</button>
<div id="soustitre"></div>
<div id="barre"></div>
<div class="ecran" id="accueil">
  <div class="saison">SAISON 3 · LA DERNIÈRE</div>
  <h1>Étincelle</h1>
  <h2>Épisode 2 — La zone morte</h2>
  <div class="duree">⭐ 6 minutes · 6 chapitres</div>
  <button class="btn" id="play">▶ Regarder</button>
</div>
<div class="ecran" id="fin">
  <h1>Fin de l'épisode 2</h1>
  <p>La porte du Néant se dresse devant eux.<br>Que se cache-t-il de l'autre côté ?</p>
  <button class="btn viol" id="rejouer">↻ Revoir l'épisode</button>
</div>
</div>
<script>
const FILM = [
 {id:'a1', dur:60, subs:[
   [1,"À l'aube, l'équipe quitta la ville endormie."],
   [12,"Étincelle en tête, le cœur battant mais décidé."],
   [24,"« Le Néant est loin, au bout des étoiles éteintes. »"],
   [35,"Le chat trottait, Lueur glissait, Hulotte volait."],
   [46,"« Tant qu'on est ensemble, on n'a peur de rien. »"],
   [54,"Et le grand voyage commença enfin."]]},
 {id:'a2', dur:60, subs:[
   [1,"Hulotte déploya une carte du ciel ancienne."],
   [12,"« Chaque étoile est un phare sur notre route. »"],
   [24,"« En les suivant, on trouvera le cœur du Néant. »"],
   [34,"Mais une étoile de la carte brillait en violet."],
   [45,"« Celle-là est déjà tombée. Le Néant avance. »"],
   [54,"« Alors dépêchons-nous », dit Étincelle, grave."]]},
 {id:'a3', dur:60, subs:[
   [1,"Bientôt, ils atteignirent une région étrange."],
   [12,"Ici, le ciel était noir. Toutes les étoiles, éteintes."],
   [24,"« La zone morte », souffla Lueur en frissonnant."],
   [34,"Plus une seule lumière. Juste un silence pesant."],
   [45,"« C'est ce qui arrivera partout si on échoue. »"],
   [54,"Étincelle serra les poings. « On n'échouera pas. »"]]},
 {id:'a4', dur:60, subs:[
   [1,"Soudain, des ombres jaillirent du sol noir !"],
   [12,"Des sbires, aux yeux verts, nés du Néant lui-même."],
   [23,"« Ils gardent la frontière ! » cria Hulotte."],
   [33,"Ils encerclèrent l'équipe, de plus en plus nombreux."],
   [43,"Le chat feula, Lueur se plaça devant Étincelle."],
   [53,"« Restez derrière moi ! » dit Étincelle."]]},
 {id:'a5', dur:60, subs:[
   [1,"Alors Étincelle rassembla toute sa lumière."],
   [12,"Elle brilla si fort que la nuit recula !"],
   [23,"Un éclat doré balaya la zone morte."],
   [33,"Les sbires, aveuglés, se dispersèrent en fumée."],
   [44,"« Ta lumière est notre arme », dit Lueur, admirative."],
   [53,"« Alors je ne la laisserai jamais s'éteindre. »"]]},
 {id:'a6', dur:60, subs:[
   [1,"Le calme revint, mais au loin, une forme apparut."],
   [12,"Une immense porte ronde, plus noire que la nuit."],
   [23,"Cernée d'un anneau violet qui palpitait lentement."],
   [34,"« La porte du Néant », murmura Hulotte, glacé."],
   [45,"« C'est là que tout se jouera », dit Étincelle."],
   [53,"Ils s'avancèrent vers l'ombre. À SUIVRE..."]]}
];
const scenes = FILM.map(s=>document.getElementById(s.id));
const stEl=document.getElementById('soustitre'), chEl=document.getElementById('chapitre'), barre=document.getElementById('barre');
const total=FILM.reduce((a,s)=>a+s.dur,0);
let idx=0,t=0,timer=null,pause=false;
function tic(){
  const sc=FILM[idx];
  scenes.forEach((el,i)=>el.classList.toggle('on',i===idx));
  chEl.textContent='CHAPITRE '+(idx+1)+' / '+FILM.length;
  let cur=''; for(const [ts,txt] of sc.subs){ if(t>=ts) cur=txt; }
  if(stEl.textContent!==cur){ stEl.textContent=cur; stEl.classList.remove('on'); void stEl.offsetWidth; stEl.classList.add('on'); }
  let ec=0; for(let i=0;i<idx;i++) ec+=FILM[i].dur; ec+=t;
  barre.style.width=(ec/total*100)+'%';
  t++;
  if(t>=sc.dur){ t=0; idx++; if(idx>=FILM.length){ fin(); return; } }
}
function demarrer(){ document.getElementById('accueil').style.display='none'; document.getElementById('fin').style.display='none'; idx=0;t=0;pause=false; clearInterval(timer); timer=setInterval(()=>{if(!pause)tic();},1000); tic(); }
function fin(){ clearInterval(timer); document.getElementById('fin').style.display='flex'; }
document.getElementById('play').onclick=demarrer;
document.getElementById('rejouer').onclick=demarrer;
document.getElementById('pausebtn').onclick=function(){ pause=!pause; this.textContent=pause?'▶':'⏸'; };
</script>
</body></html>
