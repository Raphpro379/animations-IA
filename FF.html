  #intro{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 35%,#3a2a1a,#0a0805 70%);text-align:center;padding:20px;}
  #intro .kick{letter-spacing:6px;color:#ffb84d;font-weight:bold;font-size:clamp(11px,3vw,15px);}
  #intro .part{letter-spacing:4px;color:#ff8a4d;font-weight:900;font-size:clamp(13px,3.4vw,17px);margin-top:8px;}
  #intro h1{font-size:clamp(26px,7.5vw,50px);font-weight:900;line-height:1.05;margin:10px 0;
    background:linear-gradient(180deg,#fff,#ffd7a0,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #intro .ep{font-size:clamp(15px,4.4vw,22px);color:#eee;margin-top:6px;letter-spacing:2px;}
  #intro .dur{color:#dba;margin-top:6px;font-size:clamp(12px,3.2vw,15px);}
  .playbtn{margin-top:28px;padding:14px 40px;border:none;border-radius:40px;cursor:pointer;
    background:linear-gradient(135deg,#e0662d,#ffb84d);color:#fff;font-weight:900;font-size:clamp(15px,4vw,19px);
    letter-spacing:2px;box-shadow:0 10px 30px rgba(220,100,45,.4);}
  .playbtn:active{transform:scale(.96);}
  #film{position:relative;width:min(100vw,860px);aspect-ratio:16/10;max-height:100vh;
    border-radius:14px;overflow:hidden;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.7);}
  svg.scene{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .8s;}
  svg.scene.on{opacity:1;}
  #sub{position:absolute;left:0;right:0;bottom:5%;text-align:center;z-index:20;padding:0 8%;
    font-size:clamp(15px,3.6vw,24px);font-weight:bold;color:#fff;text-shadow:0 2px 10px #000,0 0 18px rgba(0,0,0,.9);
    min-height:2em;transition:opacity .3s;}
  #barwrap{position:absolute;left:0;right:0;top:0;height:5px;background:rgba(255,255,255,.12);z-index:25;}
  #bar{height:100%;width:0;background:linear-gradient(90deg,#e0662d,#ffb84d);transition:width .2s linear;}
  #chap{position:absolute;top:12px;left:14px;z-index:25;font-size:clamp(11px,2.6vw,14px);
    color:#ffb84d;font-weight:bold;letter-spacing:1px;text-shadow:0 1px 6px #000;}
  #ctrl{position:absolute;top:10px;right:12px;z-index:25;display:flex;gap:8px;}
  #ctrl button{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);color:#fff;
    border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;}
  #end{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;

  #end.on{display:flex;}

  #end h2{font-size:clamp(24px,7vw,44px);font-weight:900;margin-top:8px;

  #end p{color:#ddd;margin-top:14px;font-size:clamp(14px,3.6vw,19px);line-height:1.5;max-width:620px;}

    background:linear-gradient(135deg,#e0662d,#ffb84d);color:#fff;font-weight:900;font-size:16px;letter-spacing:1px;}
  .star{fill:#fff;animation:tw 3s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.25;}50%{opacity:.95;}}
  .float{transform-box:fill-box;transform-origin:center;animation:fl 3.4s ease-in-out infinite;}
  @keyframes fl{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
  .float.d1{animation-delay:.4s;}.float.d2{animation-delay:.9s;}.float.d3{animation-delay:1.4s;}
  .flame{transform-box:fill-box;transform-origin:bottom;animation:flk .5s ease-in-out infinite;}
  @keyframes flk{0%,100%{transform:scaleY(1) scaleX(1);}50%{transform:scaleY(1.2) scaleX(.9);}}
  .wing{transform-box:fill-box;transform-origin:right center;animation:wingflap .6s ease-in-out infinite;}
  @keyframes wingflap{0%,100%{transform:rotate(0);}50%{transform:rotate(-25deg);}}
  .wingL{transform-box:fill-box;transform-origin:left center;animation:wingflapL .6s ease-in-out infinite;}
  @keyframes wingflapL{0%,100%{transform:rotate(0);}50%{transform:rotate(25deg);}}
  .eye{transform-box:fill-box;transform-origin:center;animation:eye 2s ease-in-out infinite;}
  @keyframes eye{0%,100%{opacity:.6;}50%{opacity:1;}}
  .glowpulse{animation:gp 2.4s ease-in-out infinite;}
  @keyframes gp{0%,100%{opacity:.4;}50%{opacity:.9;}}
  .shake{transform-box:fill-box;transform-origin:center;animation:shk .3s ease-in-out infinite;}
  @keyframes shk{0%,100%{transform:translate(0,0);}25%{transform:translate(-4px,2px);}75%{transform:translate(4px,-2px);}}
  .boom{transform-box:fill-box;transform-origin:center;animation:boomp .8s ease-out infinite;}
  @keyframes boomp{0%{transform:scale(.6);opacity:0;}30%{opacity:1;}100%{transform:scale(1.7);opacity:0;}}
  .crack{animation:crackpulse 1.2s ease-in-out infinite;}
  @keyframes crackpulse{0%,100%{opacity:.6;}50%{opacity:1;}}
  .walk{animation:walkbob .5s ease-in-out infinite;}
  @keyframes walkbob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  .rise{animation:rise 2s ease-out infinite;}
  @keyframes rise{0%{transform:translateY(15px);opacity:.4;}50%{opacity:1;}100%{transform:translateY(-10px);opacity:.3;}}
  .fadein{animation:fadein 3s ease-in forwards;}
  @keyframes fadein{from{opacity:0;}to{opacity:1;}}
  .fly{animation:flypath 4s ease-in-out infinite;}
  @keyframes flypath{0%{transform:translate(0,0);}25%{transform:translate(30px,-20px);}50%{transform:translate(60px,0);}75%{transform:translate(30px,20px);}100%{transform:translate(0,0);}}

<script>
const SCENES=[
{ id:"s1", chap:"Chapitre 1 · La légende", dur:600, subs:[[10,"Il y a très longtemps, les dragons régnaient sur le ciel du monde."],[120,"Majestueux et libres, ils volaient parmi les étoiles."],[230,"Mais les hommes eurent peur de leur puissance..."],[340,"...et un à un, les dragons disparurent, chassés sans pitié."],[450,"Jusqu'à ce qu'il n'en reste plus aucun. Ou presque."],[540,"Car quelque part, un dernier œuf attendait encore d'éclore."]]},
  { id:"s2", chap:"Chapitre 2 · Le village de Tim", dur:600, subs:[[10,"De nos jours, dans un petit village au bord de la forêt..."],[120,"...vivait un garçon nommé Tim."],[220,"Tim était curieux, courageux, et adorait explorer les bois."],[330,"« Un jour, je découvrirai quelque chose d'extraordinaire ! »"],[440,"Ses parents souriaient de ses grands rêves."],[530,"Ils ne se doutaient pas à quel point il avait raison."]]},
  { id:"s3", chap:"Chapitre 3 · Dans la forêt", dur:600, subs:[[10,"Ce matin-là, Tim s'aventura plus loin que jamais dans la forêt."],[120,"Les arbres devenaient plus vieux, plus grands, plus mystérieux."],[230,"« Personne n'est jamais venu jusqu'ici », murmura-t-il, émerveillé."],[340,"Un étrange rocher brillait au loin, entre les racines."],[450,"Une lueur dorée s'en échappait doucement."],[540,"Tim s'approcha, le cœur battant d'excitation."]]},
  { id:"s4", chap:"Chapitre 4 · L'œuf doré", dur:600, subs:[[10,"Ce n'était pas un rocher... mais un ŒUF !"],[110,"Un œuf immense, doré, couvert de taches chatoyantes."],[220,"« Waouh... je n'ai jamais rien vu d'aussi beau. »"],[330,"Tim posa doucement sa main sur la coquille tiède."],[430,"À son contact, l'œuf se mit à briller plus fort."],[530,"« On dirait qu'il... me répond ? »"]]},
  { id:"s5", chap:"Chapitre 5 · Un secret précieux", dur:600, subs:[[10,"Tim comprit qu'il ne pouvait pas laisser l'œuf tout seul."],[120,"Il le porta délicatement jusque chez lui, à la tombée de la nuit."],[230,"Il le cacha dans sa grange, sous une couverture bien chaude."],[340,"« Ne t'inquiète pas. Je vais prendre soin de toi. »"],[450,"Cette nuit-là, Tim ne dormit presque pas d'excitation."],[540,"Son grand rêve venait peut-être de commencer."]]},
  { id:"s6", chap:"Chapitre 6 · L'éclosion", dur:600, subs:[[10,"Au milieu de la nuit, un craquement réveilla Tim."],[110,"L'œuf tremblait ! Des fissures apparaissaient sur la coquille. 😲"],[220,"« Ça y est... il va éclore ! »"],[330,"Tim se pencha, retenant son souffle."],[430,"CRAC ! La coquille se fendit d'un coup."],[530,"Une petite lumière chaude s'échappa de l'intérieur."]]},
  { id:"s7", chap:"Chapitre 7 · La naissance d'Ember", dur:600, subs:[[10,"De l'œuf sortit... un bébé dragon ! 🐉"],[110,"Petit, rouge-orangé, avec de grands yeux curieux."],[220,"Il regarda Tim et fit un petit couinement adorable."],[330,"« Un... un vrai dragon ! Tu es magnifique ! », souffla Tim."],[430,"Le bébé dragon se blottit aussitôt contre lui."],[530,"« Je vais t'appeler... Ember. À cause de ta jolie couleur de flamme. »"]]},
  { id:"s8", chap:"Chapitre 8 · Une amitié qui naît", dur:600, subs:[[10,"Dès le premier jour, Tim et Ember devinrent inséparables."],[120,"Ember suivait Tim partout, comme un petit chien."],[230,"Il crachait de minuscules étincelles quand il était content."],[340,"« Doucement, tu vas mettre le feu à la grange ! », riait Tim."],[450,"Ember apprenait vite, et adorait jouer."],[540,"Pour la première fois, Tim avait un ami vraiment extraordinaire."]]},
  { id:"s9", chap:"Chapitre 9 · Les bêtises d'Ember", dur:600, subs:[[10,"Mais élever un bébé dragon n'était pas de tout repos !"],[120,"Ember mangeait tout : les pommes, les chaussures, les rideaux ! 😅"],[230,"Il brûla même par accident le chapeau du père de Tim."],[340,"« Il faut vraiment que je te cache mieux, toi ! »"],[450,"Tim devait garder Ember secret coûte que coûte."],[540,"Car si quelqu'un apprenait son existence... ce serait dangereux."]]},
  { id:"s10", chap:"Chapitre 10 · Une ombre au loin", dur:600, subs:[[10,"Pendant ce temps, un homme parcourait les villages."],[120,"Un chasseur au manteau sombre et au regard cruel : KROG."],[230,"Le dernier « chasseur de dragons » encore en vie."],[340,"« On raconte qu'une lueur dorée a été vue dans cette forêt... »"],[450,"« Un œuf de dragon. Le tout dernier. »"],[540,"« Il fera de moi le chasseur le plus célèbre du monde ! »"]]},
  { id:"s11", chap:"Chapitre 11 · Le chasseur enquête", dur:600, subs:[[10,"Krog arriva au village de Tim et posa des questions."],[120,"« Avez-vous vu quelque chose d'étrange ? Une lumière ? »"],[230,"Les villageois secouaient la tête, méfiants."],[340,"Mais Krog remarqua des traces de brûlure près d'une grange."],[450,"Un sourire mauvais se dessina sur son visage."],[530,"« Intéressant... très intéressant. »"]]},
  { id:"s12", chap:"Chapitre 12 · L'avertissement", dur:600, subs:[[10,"Un vieil ami du village prévint Tim en secret."],[120,"« Un chasseur de dragons est en ville. Il cherche quelque chose. »"],[230,"Le cœur de Tim se serra. Il pensa aussitôt à Ember."],[340,"« Il ne doit jamais te trouver, Ember. Jamais. »"],[450,"Ember, sentant l'inquiétude de Tim, se serra contre lui."],[540,"« Je te protégerai. Quoi qu'il arrive. Je te le promets. »"]]},
  { id:"s13", chap:"Chapitre 13 · Le piège se referme", dur:600, subs:[[10,"La nuit venue, Krog rôdait autour des granges du village."],[120,"Il tenait une petite fiole de poudre qui détectait la magie."],[230,"Devant la grange de Tim, la poudre se mit à briller en or. ✨"],[340,"« C'est ici. Le dragon est ici. »"],[450,"Krog prépara son arbalète et ses filets."],[540,"« Demain, à l'aube, je viendrai te chercher, petite bête. »"]]},
  { id:"s14", chap:"Chapitre 14 · La nuit de tous les dangers", dur:600, subs:[[10,"Cette nuit-là, Ember n'arrivait pas à dormir. Il tremblait."],[120,"« Tu sens quelque chose, hein ? Moi aussi. »"],[230,"Tim regarda par la fenêtre : une silhouette sombre au loin."],[340,"« Le chasseur ! Il nous a trouvés ! »"],[450,"Tim comprit qu'ils ne pouvaient plus rester ici."],[540,"« On doit partir. Cette nuit. Tout de suite. »"]]},
  { id:"s15", chap:"Chapitre 15 · L'attaque", dur:600, subs:[[10,"La porte de la grange vola en éclats ! BAM !"],[110,"« Je sais que tu caches un dragon, petit ! », rugit Krog."],[220,"Tim attrapa Ember dans ses bras et recula."],[330,"« Vous ne l'aurez jamais ! Il n'est pas un trophée ! »"],[430,"« Écarte-toi, gamin, ou tu le regretteras ! »"],[530,"Krog leva son arbalète vers le petit dragon."]]},
  { id:"s16", chap:"Chapitre 16 · La fuite", dur:600, subs:[[10,"Ember cracha une gerbe d'étincelles au visage de Krog !"],[110,"« ARGH ! Sale petite bête ! »"],[210,"Profitant de la surprise, Tim s'enfuit dans la nuit."],[320,"« Cours, Ember ! Ne te retourne pas ! »"],[430,"Ils filèrent vers la forêt, le cœur battant à tout rompre."],[530,"Derrière eux, Krog hurlait de rage."]]},
  { id:"s17", chap:"Chapitre 17 · Poursuite nocturne", dur:600, subs:[[10,"Tim courait aussi vite qu'il pouvait à travers les arbres."],[120,"Ember voletait maladroitement à ses côtés, encore trop petit pour voler."],[230,"« Tiens bon, on va y arriver ! »"],[340,"Les torches de Krog scintillaient au loin, se rapprochant."],[450,"« Il ne lâchera jamais... il faut trouver un abri ! »"],[540,"La forêt devenait de plus en plus sombre et profonde."]]},
  { id:"s18", chap:"Chapitre 18 · Le refuge", dur:600, subs:[[10,"Enfin, Tim trouva une grotte cachée derrière une cascade."],[120,"Ils s'y glissèrent, épuisés, et attendirent en silence."],[230,"Dehors, les pas de Krog passèrent... puis s'éloignèrent."],[340,"« On l'a semé... pour l'instant », souffla Tim, tremblant."],[450,"Ember se blottit contre lui, réchauffant la grotte de sa chaleur."],[540,"« On est ensemble. C'est tout ce qui compte. »"]]},
  { id:"s19", chap:"Chapitre 19 · Sous les étoiles", dur:600, subs:[[10,"Dans la grotte, Tim regarda les étoiles à travers l'eau."],[120,"« Tu sais, Ember, tu es le dernier dragon du monde. »"],[230,"« Ça veut dire que tu es très, très précieux. »"],[340,"Ember posa sa petite tête sur le genou de Tim."],[450,"« Je te ramènerai un jour là où tu seras libre. Je le jure. »"],[540,"Cette promesse allait guider tout leur voyage."]]},
  { id:"s20", chap:"Chapitre 20 · Le début du voyage", dur:600, subs:[[10,"Au petit matin, Tim prit une grande décision."],[120,"« La légende parle d'un refuge pour dragons, loin dans les montagnes. »"],[230,"« C'est là que je vais t'emmener, Ember. Là où tu seras en sécurité. »"],[340,"Un long et dangereux voyage les attendait."],[430,"Mais avec Ember à ses côtés, Tim n'avait pas peur."],[520,"Leur grande aventure ne faisait que commencer..."]]},
{ id:"s21", chap:"Chapitre 1 · Sur les routes", dur:600, subs:[[10,"Depuis des jours, Tim et Ember voyageaient vers les montagnes."],[120,"Ils marchaient le jour, se cachaient la nuit."],[230,"Ember grandissait vite : il était déjà plus gros qu'à sa naissance."],[340,"« Bientôt tu seras trop grand pour que je te porte ! », riait Tim."],[450,"Mais le danger n'était jamais loin derrière eux."],[540,"Car Krog n'avait pas renoncé. Loin de là."]]},
  { id:"s22", chap:"Chapitre 2 · Krog sur la piste", dur:600, subs:[[10,"Krog suivait leurs traces avec une patience de prédateur."],[120,"« Ils vont vers les montagnes. Le refuge des dragons, sûrement. »"],[230,"« Mais ils ne l'atteindront jamais. Je m'en assurerai. »"],[340,"Il avait engagé des hommes et des chiens pour la traque."],[450,"« Ce dragon sera à moi. Coûte que coûte. »"],[540,"L'étau se resserrait autour de Tim et Ember."]]},
  { id:"s23", chap:"Chapitre 3 · La faim", dur:600, subs:[[10,"Le voyage était rude. Les provisions s'épuisaient."],[120,"« J'ai faim... et toi aussi, hein Ember ? »"],[230,"Ember essaya d'attraper un poisson dans la rivière... et tomba dans l'eau ! 😅"],[340,"« Tu n'es pas encore très doué pour la pêche ! », rit Tim."],[450,"Ensemble, ils finirent par attraper de quoi manger."],[540,"Les épreuves les rapprochaient un peu plus chaque jour."]]},
  { id:"s24", chap:"Chapitre 4 · Les premiers sauts", dur:600, subs:[[10,"Un matin, Ember battit des ailes plus fort que d'habitude."],[120,"Il décolla de quelques centimètres... puis retomba. Plouf !"],[230,"« Tu essaies de voler ? C'est génial, Ember ! »"],[340,"« Allez, encore ! Je crois en toi ! »"],[450,"Ember réessaya, encore et encore, sans abandonner."],[540,"Voler était dans son sang de dragon. Il le sentait."]]},
  { id:"s25", chap:"Chapitre 5 · Le village hostile", dur:600, subs:[[10,"Ils traversèrent un village pour trouver à manger."],[120,"Mais les gens avaient peur des dragons depuis toujours."],[230,"« Un dragon ! Chassez-le ! », crièrent des villageois."],[340,"Tim cacha Ember sous son manteau et s'enfuit."],[450,"« Pourquoi ont-ils si peur de toi ? Tu es si gentil... »"],[540,"Tim comprenait pourquoi les dragons avaient presque disparu."]]},
  { id:"s26", chap:"Chapitre 6 · Le piège de Krog", dur:600, subs:[[10,"Un soir, Krog leur tendit une embuscade sur un pont étroit."],[110,"« Vous voilà enfin ! Il n'y a plus d'échappatoire ! »"],[220,"Ses hommes bloquaient les deux côtés du pont."],[330,"« Donne-moi le dragon, gamin, et je te laisse la vie. »"],[430,"Tim serra Ember contre lui. « Jamais ! »"],[530,"La situation semblait désespérée."]]},
  { id:"s27", chap:"Chapitre 7 · Le premier envol", dur:600, subs:[[10,"Acculé, Tim ferma les yeux, serrant Ember de toutes ses forces."],[110,"« Ember, si tu peux voler... c'est MAINTENANT ! »"],[220,"Alors, dans un cri, Ember déploya ses ailes en grand !"],[330,"Et pour la première fois... il S'ENVOLA vraiment ! 🐉"],[430,"Emportant Tim avec lui, loin au-dessus du pont !"],[530,"« TU VOLES ! EMBER, TU VOLES ! », cria Tim, fou de joie."]]},
  { id:"s28", chap:"Chapitre 8 · Libres dans le ciel", dur:600, subs:[[10,"Ember fendait les airs, Tim accroché à son dos."],[120,"Le vent sifflait, les montagnes défilaient sous eux."],[230,"« C'est... c'est le plus beau jour de ma vie ! », hurla Tim."],[340,"Ember rugissait de bonheur, crachant des flammes de joie."],[450,"En bas, Krog les regardait s'échapper, impuissant."],[540,"« NON ! Revenez ici ! », hurla-t-il de rage."]]},
  { id:"s29", chap:"Chapitre 9 · La colère de Krog", dur:600, subs:[[10,"Krog écumait de rage d'avoir laissé filer le dragon."],[120,"« Ils croient m'avoir semé... quelle erreur ! »"],[230,"Il sortit une vieille carte et pointa les montagnes."],[340,"« Le refuge des dragons est là. Ils y vont forcément. »"],[450,"« Je les y attendrai. Et cette fois, ils ne s'échapperont pas. »"],[540,"Krog prépara son piège le plus terrible."]]},
  { id:"s30", chap:"Chapitre 10 · Apprendre à voler", dur:600, subs:[[10,"Les jours suivants, Ember s'entraîna à voler pour de bon."],[120,"D'abord maladroit, il devint de plus en plus gracieux."],[230,"« Tourne à gauche ! Maintenant remonte ! Parfait ! »"],[340,"Tim et Ember formaient une équipe incroyable."],[450,"Ember grandissait aussi : il était maintenant de la taille d'un cheval."],[540,"Le refuge des montagnes n'était plus très loin."]]},
  { id:"s31", chap:"Chapitre 11 · La tempête", dur:600, subs:[[10,"Mais en approchant des sommets, une terrible tempête éclata."],[120,"La pluie, le vent, les éclairs : Ember avait du mal à voler."],[230,"« Tiens bon, Ember ! On va y arriver ensemble ! »"],[340,"Un éclair frôla ses ailes, et ils faillirent tomber."],[450,"Tim guida Ember vers un abri dans la falaise."],[540,"Ils avaient survécu, mais la montagne était impitoyable."]]},
  { id:"s32", chap:"Chapitre 12 · Le doute", dur:600, subs:[[10,"Réfugiés dans une grotte, Tim et Ember reprenaient leur souffle."],[120,"« Parfois, je me demande si on y arrivera un jour... », soupira Tim."],[230,"Ember posa doucement sa tête contre lui pour le réconforter."],[340,"« Tu as raison. Tant qu'on est ensemble, on ne doit pas abandonner. »"],[450,"« On a affronté un chasseur, une tempête... on peut tout affronter ! »"],[540,"Leur amitié était plus forte que toutes les épreuves."]]},
  { id:"s33", chap:"Chapitre 13 · Une rencontre", dur:600, subs:[[10,"En chemin, ils rencontrèrent une vieille ermite des montagnes."],[120,"« Un dragon vivant... je croyais ne jamais en revoir. »"],[230,"« Le refuge dont tu parles existe, petit. Au sommet du Mont Aurore. »"],[340,"« Mais méfie-toi : un chasseur t'y a précédé. »"],[450,"Le cœur de Tim se glaça. « Krog. Il nous attend là-haut. »"],[540,"« Alors nous irons quand même. Ember mérite d'être libre. »"]]},
  { id:"s34", chap:"Chapitre 14 · Le don de l'ermite", dur:600, subs:[[10,"L'ermite offrit à Tim une vieille amulette dorée."],[120,"« Elle appartenait aux anciens gardiens de dragons. »"],[230,"« Elle protège celui qui aime vraiment un dragon. Garde-la. »"],[340,"« Merci... je ne l'oublierai pas. »"],[450,"Tim passa l'amulette à son cou, plein d'espoir."],[540,"Cette amulette jouerait un rôle crucial dans le combat à venir."]]},
  { id:"s35", chap:"Chapitre 15 · Vers le Mont Aurore", dur:600, subs:[[10,"Le lendemain, ils reprirent leur route vers le Mont Aurore."],[120,"C'était le plus haut sommet, celui qui touchait presque le ciel."],[230,"« C'est là-haut que tu retrouveras les tiens, Ember. »"],[340,"Ember vola avec détermination, portant Tim vers leur destin."],[450,"Mais chaque battement d'ailes les rapprochait aussi de Krog."],[540,"Le grand affrontement approchait."]]},
  { id:"s36", chap:"Chapitre 16 · L'embuscade finale", dur:600, subs:[[10,"Au pied du Mont Aurore, Krog avait tendu son dernier piège."],[120,"Des filets géants, des pièges, toute une armée de chasseurs."],[230,"« Ils arrivent. Je le sens. »"],[340,"« Cette fois, le dernier dragon sera à moi. »"],[450,"« Et le gamin ne pourra rien y faire. »"],[540,"Krog attendait, l'arbalète chargée, un sourire cruel aux lèvres."]]},
  { id:"s37", chap:"Chapitre 17 · Le piège se referme", dur:600, subs:[[10,"Alors qu'Ember survolait la vallée, un filet géant jaillit !"],[110,"Il s'abattit sur ses ailes, l'entraînant vers le sol ! 😱"],[220,"« EMBER ! », hurla Tim en tombant avec lui."],[330,"Ils s'écrasèrent au sol, pris au piège de Krog."],[430,"« Enfin ! », ricana le chasseur en s'approchant."],[530,"« Le dernier dragon est à moi ! »"]]},
  { id:"s38", chap:"Chapitre 18 · Ember capturé", dur:600, subs:[[10,"Krog enferma Ember dans une cage de fer épaisse."],[110,"« Voilà. Bien au chaud, petit dragon. »"],[220,"« Laissez-le partir ! Il n'a rien fait de mal ! », supplia Tim."],[330,"« Rien fait ? C'est un DRAGON, gamin. Ça vaut une fortune. »"],[430,"Ember rugissait désespérément derrière les barreaux."],[530,"Tim était impuissant, le cœur brisé."]]},
  { id:"s39", chap:"Chapitre 19 · Le désespoir de Tim", dur:600, subs:[[10,"Attaché à un arbre, Tim regardait la cage d'Ember, désespéré."],[120,"« Tout est de ma faute... je n'ai pas su te protéger. »"],[230,"Mais soudain, l'amulette de l'ermite se mit à briller. ✨"],[340,"« L'amulette... elle réagit à mon amour pour Ember ! »"],[450,"Une chaleur nouvelle envahit le cœur de Tim."],[540,"« Non. Je n'abandonnerai pas. Jamais. Tiens bon, Ember ! »"]]},
  { id:"s40", chap:"Chapitre 20 · La nuit avant le combat", dur:600, subs:[[10,"Cette nuit-là, Tim élabora un plan pour libérer Ember."],[120,"Le refuge des dragons était juste au sommet, si près..."],[230,"« Demain, on se libère. Et on monte là-haut. Ensemble. »"],[340,"Ember, dans sa cage, croisa le regard de Tim et hocha la tête."],[430,"Leur lien était incassable, même derrière les barreaux."],[520,"Le grand combat final allait commencer à l'aube..."]]},
{ id:"s41", chap:"Chapitre 1 · L'aube du combat", dur:600, subs:[[10,"L'aube se leva sur le Mont Aurore, rouge comme le feu."],[120,"Tim, toujours attaché, regardait la cage d'Ember."],[230,"« C'est aujourd'hui, Ember. Aujourd'hui, tu seras libre. »"],[340,"Il frotta l'amulette dorée contre ses liens."],[450,"À sa grande surprise, l'amulette brûla la corde d'un coup ! ✨"],[540,"« L'amulette... elle me donne une force incroyable ! »"]]},
  { id:"s42", chap:"Chapitre 2 · La libération", dur:600, subs:[[10,"Tim se glissa jusqu'à la cage d'Ember en silence."],[120,"« Tiens bon, mon ami. Je vais te sortir de là. »"],[230,"Grâce à la force de l'amulette, il tordit les barreaux."],[340,"Ember bondit hors de la cage et se serra contre Tim."],[450,"« On a réussi ! Maintenant, montons au sommet, vite ! »"],[540,"Mais un cri retentit derrière eux..."]]},
  { id:"s43", chap:"Chapitre 3 · Krog les rattrape", dur:600, subs:[[10,"« OÙ CROYEZ-VOUS ALLER ?! », rugit Krog, furieux."],[120,"Le chasseur se dressait devant eux, bloquant le chemin du sommet."],[230,"« Vous n'irez pas plus loin. Ce dragon est à moi ! »"],[340,"« Non ! Ember n'appartient à personne ! », cria Tim."],[450,"« Il est libre ! Les dragons sont faits pour le ciel, pas pour les cages ! »"],[540,"Krog leva son arbalète, le visage déformé par la rage."]]},
  { id:"s44", chap:"Chapitre 4 · Tim protège Ember", dur:600, subs:[[10,"Krog tira une flèche droit sur Ember !"],[110,"Sans hésiter, Tim se jeta devant le dragon pour le protéger."],[220,"Mais l'amulette dorée créa un bouclier de lumière ! ✨"],[330,"La flèche rebondit, sans faire de mal à personne."],[430,"« Impossible ! Qu'est-ce que c'est que cette magie ?! »"],[530,"« C'est la force de l'amitié, Krog. Tu ne la comprendras jamais. »"]]},
  { id:"s45", chap:"Chapitre 5 · Ember défend son ami", dur:600, subs:[[10,"Voyant Tim en danger, Ember se dressa de toute sa taille."],[120,"Pour la première fois, il cracha un vrai jet de flammes !"],[230,"Le feu força Krog à reculer, brûlant ses filets et ses pièges."],[340,"« Tu vois, Krog ? Il me protège, comme je le protège ! »"],[450,"Ember n'était plus un bébé effrayé : il devenait fort."],[540,"« On ne se laissera plus jamais faire ! »"]]},
  { id:"s46", chap:"Chapitre 6 · Le combat", dur:600, subs:[[10,"Un combat acharné s'engagea sur les pentes du Mont Aurore."],[120,"Krog lançait filets et flèches ; Ember ripostait de son feu."],[230,"Tim guidait le dragon, esquivant les attaques du chasseur."],[340,"« On forme une équipe, Ember ! Ensemble, on est plus forts ! »"],[450,"Petit à petit, ils prenaient l'avantage sur Krog."],[540,"Mais le chasseur avait plus d'un tour dans son sac."]]},
  { id:"s47", chap:"Chapitre 7 · La ruse de Krog", dur:600, subs:[[10,"Krog fit rouler un rocher qui sépara Tim d'Ember !"],[120,"« Sans ton dragon, tu n'es qu'un enfant sans défense ! »"],[230,"Il attrapa Tim et le tint au bord d'un précipice."],[340,"« Rends-toi, dragon, ou je lâche le gamin ! »"],[450,"Ember s'arrêta net, terrifié pour son ami."],[540,"Le petit dragon ne savait plus quoi faire."]]},
  { id:"s48", chap:"Chapitre 8 · Le choix d'Ember", dur:600, subs:[[10,"Ember regardait Tim, prisonnier de Krog au bord du vide."],[120,"Il aurait pu s'enfuir, être enfin libre... mais jamais sans Tim."],[230,"« Un dragon n'abandonne pas celui qu'il aime », semblait dire son regard."],[340,"Ember baissa la tête et s'approcha lentement, en signe de reddition."],[450,"« C'est ça ! Gentil dragon... », ricana Krog, triomphant."],[540,"Mais c'était exactement ce que Tim attendait."]]},
  { id:"s49", chap:"Chapitre 9 · Le plan de Tim", dur:600, subs:[[10,"Au moment où Krog baissait sa garde, Tim saisit l'amulette."],[120,"« MAINTENANT, EMBER ! », cria-t-il de toutes ses forces."],[230,"L'amulette explosa d'une lumière aveuglante ! ✨"],[340,"Krog, ébloui, lâcha Tim qui roula loin du précipice."],[450,"Ember bondit et rattrapa Tim au vol, in extremis !"],[540,"« Je te tiens ! Je ne te lâcherai jamais ! »"]]},
  { id:"s50", chap:"Chapitre 10 · Ember devient grand", dur:600, subs:[[10,"Alors, porté par le courage et l'amour de Tim, Ember changea."],[120,"Une lumière l'enveloppa : il grandit d'un coup, devenant immense ! 🐉"],[230,"Le petit bébé dragon était devenu un dragon magnifique et puissant."],[340,"« Ember... tu es devenu grand ! Tu es splendide ! »"],[450,"Ember poussa un rugissement qui fit trembler la montagne."],[540,"Krog recula, pour la première fois vraiment effrayé."]]},
  { id:"s51", chap:"Chapitre 11 · La peur du chasseur", dur:600, subs:[[10,"Face au dragon adulte, Krog n'était plus si courageux."],[120,"« Ce... ce n'est pas possible... reste où tu es, monstre ! »"],[230,"Ember s'avança, majestueux, protégeant Tim de son aile."],[340,"« Ce n'est pas un monstre, Krog. C'est mon ami. »"],[450,"« Et il est temps que tu comprennes le mal que tu as fait. »"],[540,"Ember ouvrit la gueule, prêt à cracher son feu le plus puissant."]]},
  { id:"s52", chap:"Chapitre 12 · La leçon", dur:600, subs:[[10,"Mais au lieu d'attaquer, Ember s'arrêta."],[120,"« Non, Ember. On ne sera pas cruels comme lui. », dit doucement Tim."],[230,"Le dragon souffla, éteignant sa flamme."],[340,"« Va-t'en, Krog. Et ne chasse plus jamais de dragons. »"],[450,"Krog, tremblant, comprit qu'il avait perdu."],[540,"« Un dragon qui épargne son ennemi... je n'aurais jamais cru voir ça. »"]]},
  { id:"s53", chap:"Chapitre 13 · Le départ de Krog", dur:600, subs:[[10,"Krog laissa tomber son arbalète au sol."],[120,"« Toute ma vie, j'ai chassé les dragons par gloire... »"],[230,"« ...mais je n'ai jamais rien compris à leur vraie nature. »"],[340,"Il tourna les talons et redescendit la montagne, seul."],[450,"« Adieu, dernier dragon. Sois libre. »"],[540,"Et pour la première fois, Krog ressentit quelque chose comme du regret."]]},
  { id:"s54", chap:"Chapitre 14 · Le sommet", dur:600, subs:[[10,"Enfin, Tim et Ember atteignirent le sommet du Mont Aurore."],[120,"Là, un panorama magnifique s'étendait à perte de vue."],[230,"« On a réussi, Ember. On est arrivés. »"],[340,"Le soleil levant baignait la montagne d'une lumière dorée."],[450,"« C'est ici que la légende parle du refuge des dragons. »"],[540,"Mais tout semblait vide et silencieux..."]]},
  { id:"s55", chap:"Chapitre 15 · Le refuge des dragons", dur:600, subs:[[10,"Soudain, Ember poussa un long rugissement vers le ciel."],[120,"Et au loin, d'autres rugissements lui répondirent ! 🐉"],[230,"Des formes ailées émergèrent des nuages : d'AUTRES dragons !"],[340,"« Ils existent ! Le refuge est réel ! Tu n'es pas seul, Ember ! »"],[450,"Ember n'était pas le dernier dragon après tout : d'autres avaient survécu, cachés."],[540,"Sa vraie famille était là, l'attendant depuis toujours."]]},
  { id:"s56", chap:"Chapitre 16 · Retrouver les siens", dur:600, subs:[[10,"Les dragons entourèrent Ember, l'accueillant avec joie."],[120,"Ember volait avec eux, radieux, enfin parmi les siens."],[230,"Mais soudain, il s'arrêta et regarda Tim, resté au sol."],[340,"Un choix difficile se présentait à lui : sa famille... ou son ami ?"],[450,"Ember redescendit se poser doucement devant Tim."],[540,"Le moment le plus émouvant de leur histoire était arrivé."]]},
  { id:"s57", chap:"Chapitre 17 · L'adieu", dur:600, subs:[[10,"« Ember... ta famille t'attend. Ta vraie place est ici. »"],[120,"Les yeux de Tim se remplirent de larmes."],[230,"« Tu vas me manquer plus que tout au monde... »"],[340,"« Mais je veux que tu sois libre et heureux. C'est ça, aimer. »"],[450,"Ember posa doucement sa tête contre Tim une dernière fois."],[540,"Aucun des deux ne voulait dire au revoir."]]},
  { id:"s58", chap:"Chapitre 18 · Un lien éternel", dur:600, subs:[[10,"Alors, l'amulette dorée se brisa doucement en deux moitiés."],[120,"Une pour Tim, une qui se fondit dans le cœur d'Ember."],[230,"« Comme ça, où que tu sois, une part de moi sera avec toi. »"],[340,"« Et une part de toi restera toujours avec moi. »"],[450,"« On ne se dira jamais vraiment adieu, Ember. »"],[540,"Leur lien dépassait la distance et le temps."]]},
  { id:"s59", chap:"Chapitre 19 · L'envol", dur:600, subs:[[10,"Ember déploya ses grandes ailes et s'éleva dans le ciel doré."],[120,"Il rejoignit les autres dragons, tournoyant au-dessus de Tim."],[230,"« VOLE, EMBER ! VOLE HAUT ! », cria Tim en agitant la main."],[340,"Ember rugit une dernière fois, un rugissement plein d'amour."],[450,"Puis il cracha dans le ciel un grand cœur de flammes. ❤️🔥"],[540,"Le cadeau d'adieu du dragon à son meilleur ami."]]},
  { id:"s60", chap:"Chapitre 20 · Pour toujours amis", dur:600, subs:[[10,"Tim redescendit la montagne, le cœur à la fois lourd et léger."],[120,"Il avait perdu son compagnon de tous les jours..."],[230,"...mais il lui avait offert la plus belle chose : la liberté."],[340,"Souvent, la nuit, il levait les yeux et voyait une flamme dans le ciel."],[450,"C'était Ember, veillant sur lui, où qu'il soit."],[530,"Car les vrais amis ne se quittent jamais vraiment. 🐉❤️"]]}
];
let si=0,t=0,subIdx=0,paused=false,timer=null;
let totalDur=SCENES.reduce((a,s)=>a+s.dur,0),elapsedBefore=0;
const $=id=>document.getElementById(id);
function actOf(i){ if(i<20) return "🎬 ACTE 1 · La découverte"; if(i<40) return "🎬 ACTE 2 · La fuite"; return "🎬 ACTE 3 · Le combat final"; }
function demarrer(){$('intro').style.display='none';$('film').style.display='block';si=0;t=0;subIdx=0;elapsedBefore=0;showScene();timer=setInterval(tic,100);}
function showScene(){document.querySelectorAll('.scene').forEach(e=>e.classList.remove('on'));const sc=SCENES[si];document.getElementById(sc.id).classList.add('on');$('chap').textContent=sc.chap;$('actbadge').textContent=actOf(si);$('sub').textContent='';subIdx=0;}
function tic(){if(paused)return;t++;const sc=SCENES[si];while(subIdx<sc.subs.length&&t>=sc.subs[subIdx][0]){$('sub').textContent=sc.subs[subIdx][1];subIdx++;}const done=elapsedBefore+t;$('bar').style.width=Math.min(100,(done/totalDur)*100)+'%';if(t>=sc.dur){elapsedBefore+=sc.dur;si++;t=0;if(si>=SCENES.length){finir();return;}showScene();}}
function togglePause(){paused=!paused;$('pauseBtn').textContent=paused?'▶ Lecture':'⏸ Pause';}
function finir(){clearInterval(timer);$('film').style.display='none';$('endtext').innerHTML="Tim a rendu Ember à sa liberté et à sa famille de dragons. 🐉<br>Leur amitié restera éternelle, gravée dans le ciel.<br>Merci d'avoir suivi Le Dernier Œuf de Dragon ! ❤️🔥";$('end').classList.add('on');}
</script>
