<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 880" width="600" height="880">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2a1145"/>
      <stop offset="55%" stop-color="#140a26"/>
      <stop offset="100%" stop-color="#060310"/>
    </radialGradient>
    <radialGradient id="gFire" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ff7a2d"/><stop offset="100%" stop-color="#ff2d2d" stop-opacity="0"/></radialGradient>
    <radialGradient id="gWater" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#49c6ff"/><stop offset="100%" stop-color="#2d6bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="gEarth" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#7bd66a"/><stop offset="100%" stop-color="#3a8f2d" stop-opacity="0"/></radialGradient>
    <radialGradient id="gAir" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#d9f0ff"/><stop offset="100%" stop-color="#9fd0ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a0f2e"/><stop offset="100%" stop-color="#0a0518"/></linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="60%" stop-color="#ffdca0"/><stop offset="100%" stop-color="#ff9d4d"/>
    </linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="600" height="880" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="600" height="880" fill="url(#bg)"/>

    <!-- étoiles scintillantes -->
    <g fill="#fff">
      <circle cx="60" cy="120" r="2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="90" r="2.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="70" r="1.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="440" cy="160" r="2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="50" r="1.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="90" cy="230" r="1.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" begin="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="540" cy="240" r="1.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- grande ombre du méchant Nyx -->
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1.03 1.06;1 1" dur="5s" repeatCount="indefinite" additive="sum"/>
      <path d="M300 250 C210 250 170 360 190 470 C210 560 260 560 300 560 C340 560 390 560 410 470 C430 360 390 250 300 250 Z" fill="#0d0518" opacity="0.9"/>
      <path d="M235 300 Q220 240 250 250 M365 300 Q380 240 350 250" stroke="#0d0518" stroke-width="26" fill="none" stroke-linecap="round"/>
      <ellipse cx="262" cy="360" rx="16" ry="22" fill="#a24bff"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="338" cy="360" rx="16" ry="22" fill="#a24bff"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" begin="0.4s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="262" cy="360" rx="6" ry="9" fill="#1a0033"/>
      <ellipse cx="338" cy="360" rx="6" ry="9" fill="#1a0033"/>
    </g>

    <!-- sol -->
    <path d="M0 720 Q300 680 600 720 L600 880 L0 880 Z" fill="url(#ground)"/>

    <!-- halos élémentaires -->
    <circle cx="150" cy="640" r="95" fill="url(#gFire)"><animate attributeName="opacity" values="0.35;0.7;0.35" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="640" r="95" fill="url(#gWater)"><animate attributeName="opacity" values="0.35;0.7;0.35" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="700" r="95" fill="url(#gEarth)"><animate attributeName="opacity" values="0.35;0.7;0.35" dur="4s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="700" r="95" fill="url(#gAir)"><animate attributeName="opacity" values="0.35;0.7;0.35" dur="4s" begin="3s" repeatCount="indefinite"/></circle>

    <!-- ===== 4 HÉROS ANIMAUX ===== -->

    <!-- BLAZE le renard de feu -->
    <g transform="translate(120,600)">
      <animateTransform attributeName="transform" type="translate" values="120,600;120,592;120,600" dur="3.4s" repeatCount="indefinite" additive="sum"/>
      <ellipse cx="30" cy="95" rx="34" ry="10" fill="#000" opacity=".3"/>
      <path d="M30 30 C8 30 2 55 12 78 C20 96 40 96 48 78 C58 55 52 30 30 30 Z" fill="#ff6a2d"/>
      <path d="M30 78 C22 78 20 90 30 92 C40 90 38 78 30 78 Z" fill="#ffe0c2"/>
      <path d="M12 34 L2 12 L22 26 Z" fill="#ff6a2d"/><path d="M48 34 L58 12 L38 26 Z" fill="#ff6a2d"/>
      <path d="M14 30 L8 18 L20 27 Z" fill="#ffb37a"/><path d="M46 30 L52 18 L40 27 Z" fill="#ffb37a"/>
      <circle cx="20" cy="52" r="5" fill="#fff"/><circle cx="40" cy="52" r="5" fill="#fff"/>
      <circle cx="21" cy="53" r="3" fill="#1a0a00"/><circle cx="39" cy="53" r="3" fill="#1a0a00"/>
      <circle cx="30" cy="64" r="3.5" fill="#3a1500"/>
      <path d="M55 70 Q85 60 78 90 Q70 100 58 88 Z" fill="#ff8a4d"/>
      <path d="M75 68 Q95 66 88 82" stroke="#ffd36b" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- ONDA la loutre d'eau -->
    <g transform="translate(410,600)">
      <animateTransform attributeName="transform" type="translate" values="410,600;410,592;410,600" dur="3.4s" begin="0.5s" repeatCount="indefinite" additive="sum"/>
      <ellipse cx="30" cy="95" rx="34" ry="10" fill="#000" opacity=".3"/>
      <path d="M30 32 C10 32 6 56 16 80 C24 98 44 98 52 80 C62 56 50 32 30 32 Z" fill="#4aa3d6"/>
      <ellipse cx="30" cy="70" rx="15" ry="14" fill="#cfeaff"/>
      <circle cx="16" cy="30" r="8" fill="#4aa3d6"/><circle cx="44" cy="30" r="8" fill="#4aa3d6"/>
      <circle cx="21" cy="54" r="5" fill="#fff"/><circle cx="39" cy="54" r="5" fill="#fff"/>
      <circle cx="22" cy="55" r="3" fill="#06263a"/><circle cx="38" cy="55" r="3" fill="#06263a"/>
      <circle cx="30" cy="66" r="3.5" fill="#06263a"/>
      <path d="M24 72 Q30 78 36 72" stroke="#06263a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="66" cy="52" r="6" fill="#8fd0ff" opacity=".8"/>
      <circle cx="76" cy="40" r="4" fill="#8fd0ff" opacity=".7"/>
      <circle cx="60" cy="40" r="3" fill="#8fd0ff" opacity=".6"/>
    </g>

    <!-- ROC la tortue de terre -->
    <g transform="translate(195,660)">
      <animateTransform attributeName="transform" type="translate" values="195,660;195,652;195,660" dur="3.4s" begin="1s" repeatCount="indefinite" additive="sum"/>
      <ellipse cx="35" cy="88" rx="40" ry="11" fill="#000" opacity=".3"/>
      <path d="M10 70 Q35 30 60 70 Q60 82 35 82 Q10 82 10 70 Z" fill="#6b8f3d"/>
      <path d="M22 58 L30 48 L38 58 L30 66 Z" fill="#3d5f1f"/>
      <path d="M42 58 L50 48 L54 60 L46 66 Z" fill="#3d5f1f"/>
      <path d="M14 66 L20 58 L26 68 Z" fill="#3d5f1f"/>
      <path d="M0 68 Q-4 60 4 58 Q12 60 12 70 Z" fill="#9bbf6a"/>
      <circle cx="4" cy="62" r="2.5" fill="#1a2a0a"/>
      <ellipse cx="30" cy="80" rx="6" ry="4" fill="#9bbf6a"/><ellipse cx="52" cy="80" rx="6" ry="4" fill="#9bbf6a"/>
    </g>

    <!-- ZÉPHYR l'oiseau d'air -->
    <g transform="translate(345,650)">
      <animateTransform attributeName="transform" type="translate" values="345,650;345,642;345,650" dur="3.4s" begin="1.5s" repeatCount="indefinite" additive="sum"/>
      <ellipse cx="30" cy="90" rx="26" ry="8" fill="#000" opacity=".3"/>
      <ellipse cx="30" cy="60" rx="22" ry="26" fill="#e8f4ff"/>
      <circle cx="30" cy="34" r="17" fill="#e8f4ff"/>
      <path d="M30 40 L40 46 L30 50 Z" fill="#ffcf5a"/>
      <circle cx="24" cy="32" r="4" fill="#fff"/><circle cx="36" cy="32" r="4" fill="#fff"/>
      <circle cx="24" cy="33" r="2.2" fill="#123"/><circle cx="36" cy="33" r="2.2" fill="#123"/>
      <path d="M8 58 Q-8 64 6 76 Q16 72 18 62 Z" fill="#bfe3ff"/>
      <path d="M52 58 Q68 64 54 76 Q44 72 42 62 Z" fill="#bfe3ff"/>
      <path d="M20 12 Q30 -2 40 12" stroke="#bfe3ff" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- ===== TEXTES ===== -->
    <text x="300" y="70" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="15" letter-spacing="6" font-weight="bold" fill="#ffd36b" opacity="0.9">CINÉÈR PRÉSENTE</text>

    <text x="300" y="128" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="52" font-weight="900" fill="url(#titleGrad)">LE CLAN</text>
    <text x="300" y="178" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="52" font-weight="900" fill="url(#titleGrad)">DES 4 ÉLÉMENTS</text>

    <text x="300" y="212" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="20" letter-spacing="3" font-weight="bold" fill="#eeeeee">FEU · EAU · TERRE · AIR</text>

    <!-- pastilles éléments -->
    <text x="300" y="770" text-anchor="middle" font-family="sans-serif" font-size="30">🔥 💧 🌍 💨</text>

    <text x="300" y="812" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" letter-spacing="3" font-weight="bold" fill="#cfeecf" opacity="0.85">SAISON 1 · L'OMBRE DE NYX APPROCHE</text>

    <text x="300" y="850" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="16" letter-spacing="4" font-weight="900" fill="#ff5a5a">✦ CINÉÈR ✦</text>

    <!-- liseré -->
    <rect x="1.5" y="1.5" width="597" height="877" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  </g>
</svg>
