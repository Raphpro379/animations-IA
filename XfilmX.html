<title>Le Gardien des Océans — Le Film</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bleu:#0e6a94;--bleuclair:#3fb6d8;--or:#ffd66b;--nuit:#041826}
  body{font-family:'Trebuchet MS',system-ui,sans-serif;background:var(--nuit);color:#fff;overflow:hidden;height:100vh}
  #scene-box{position:fixed;inset:0}
  .scene{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.2s ease}
  .scene.on{opacity:1}

  /* accueil */
  #accueil{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%,#0e6a94,#041826);z-index:20;text-align:center;padding:20px}
  #accueil .eyebrow{letter-spacing:4px;font-size:clamp(11px,2.5vw,15px);color:var(--bleuclair);text-transform:uppercase;margin-bottom:14px}
  #accueil h1{font-size:clamp(34px,9vw,72px);line-height:1.05;text-shadow:0 4px 24px rgba(0,0,0,.5)}
  #accueil h1 span{color:var(--or)}
  #accueil .part{margin-top:10px;font-size:clamp(15px,4vw,22px);font-style:italic;opacity:.9}
  #play{margin-top:36px;padding:16px 40px;font-size:20px;font-weight:bold;color:var(--nuit);background:var(--or);
    border:none;border-radius:40px;cursor:pointer;box-shadow:0 6px 20px rgba(255,214,107,.4);transition:transform .2s}
  #play:hover{transform:scale(1.06)}
  .waves{position:absolute;bottom:0;left:0;width:100%;height:120px;opacity:.3}

  /* sous-titres */
  #soustitre{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);width:90%;max-width:760px;
    text-align:center;font-size:clamp(16px,3.6vw,24px);line-height:1.4;
    background:rgba(0,0,0,.45);padding:12px 20px;border-radius:14px;backdrop-filter:blur(3px);
    opacity:0;transition:opacity .4s}
  #soustitre.on{opacity:1}

  /* barre lecteur */
  #lecteur{position:fixed;bottom:0;left:0;width:100%;padding:12px 16px;display:flex;align-items:center;gap:12px;
    background:linear-gradient(transparent,rgba(0,0,0,.6));z-index:15}
  #lecteur button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;
    padding:8px 14px;border-radius:20px;cursor:pointer;font-size:15px}
  #lecteur button:hover{background:rgba(255,255,255,.3)}
  #chapitre{font-size:13px;opacity:.8;white-space:nowrap}
  #barre{flex:1;height:6px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden}
  #barrePlein{height:100%;width:0;background:var(--bleuclair);border-radius:4px;transition:width .3s linear}

  /* fin */
  #fin{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle,#0e6a94,#041826);z-index:25;text-align:center;padding:20px}
  #fin h2{font-size:clamp(26px,7vw,52px);color:var(--or);margin-bottom:16px}
  #fin p{font-size:clamp(15px,3.6vw,20px);max-width:600px;line-height:1.5;opacity:.9}
  #fin button{margin-top:28px;padding:14px 34px;font-size:18px;background:var(--or);color:var(--nuit);
    border:none;border-radius:30px;cursor:pointer;font-weight:bold}
</style>
</head>

<script>
const FILM = [{"id": "p1_a1", "dur": 60, "subs": [[0, "Sur une petite île bordée de récifs vivait un garçon nommé Léo."], [12, "Il passait ses journées les pieds dans l'eau, à écouter la mer."], [26, "Les vieux pêcheurs disaient : « Cet enfant comprend l'océan. »"], [40, "Léo ne savait pas encore à quel point c'était vrai..."], [52, "Ce matin-là, la mer était étrangement calme. Trop calme."]]}, {"id": "p1_a2", "dur": 60, "subs": [[0, "Sur le sable, une petite tortue était échouée, épuisée."], [13, "Léo se pencha doucement et la remit à l'eau."], [27, "— Merci, souffla une petite voix."], [38, "Léo sursauta. La tortue... lui avait parlé ?!"], [50, "— Tu m'entends ? Personne n'entend jamais les animaux marins !"]]}, {"id": "p1_a3", "dur": 60, "subs": [[0, "La tortue s'appelait Coquille. Elle n'en revenait pas."], [14, "— Depuis toujours, seul le Gardien des Océans peut nous entendre."], [30, "— Le... Gardien ? demanda Léo, le cœur battant."], [43, "— L'océan t'a choisi, Léo. Et il a besoin de toi. Vite."], [54, "Au loin, un grondement sourd monta des profondeurs."]]}, {"id": "p1_a4", "dur": 60, "subs": [[0, "Coquille entraîna Léo au bord de l'eau."], [12, "— Regarde là-bas. La mer... recule."], [25, "L'eau se retirait, comme aspirée par une force invisible."], [39, "Les poissons tournaient en panique dans les flaques."], [51, "— Quelque chose assèche l'océan, dit Coquille. Depuis trois jours."]]}, {"id": "p1_a5", "dur": 60, "subs": [[0, "— Mais comment je peux respirer sous l'eau ? demanda Léo."], [13, "Coquille sourit. — Le Gardien reçoit un don en acceptant sa mission."], [28, "Elle toucha le front de Léo avec sa nageoire."], [39, "Une lumière turquoise l'enveloppa. Léo se sentit... léger."], [51, "— Maintenant, la mer est ta maison. Plonge avec moi !"]]}, {"id": "p1_a6", "dur": 60, "subs": [[0, "Léo plongea. Et pour la première fois, il respira sous l'eau !"], [14, "Le récif s'ouvrait devant lui, éclatant de couleurs."], [28, "Des poissons dorés, des coraux roses, des anémones dansantes."], [41, "— C'est... magnifique, murmura Léo, émerveillé."], [52, "Mais plus loin, le corail devenait gris. Sans vie."]]}, {"id": "p1_a7", "dur": 60, "subs": [[0, "Un grand poulpe violet surgit d'une grotte de corail."], [13, "— Je suis Octave, dit-il d'une voix maligne. Gardien des récifs."], [28, "— Coquille m'avait prévenu de ton arrivée, jeune Léo."], [41, "— Le récif meurt. L'eau part par un tourbillon, tout au fond."], [53, "— Un tourbillon ? Personne n'ose s'en approcher, ajouta Coquille."]]}, {"id": "p1_a8", "dur": 60, "subs": [[0, "— Il nous faut le Cœur de l'Océan, déclara Octave, grave."], [14, "— Le Cœur ? répéta Léo."], [24, "— Un cristal ancien, caché au plus profond des abysses."], [37, "— Lui seul peut rendre à la mer sa force et sa vie."], [49, "— Alors allons-y ! dit Léo. Je ne laisserai pas l'océan mourir."]]}, {"id": "p1_a9", "dur": 60, "subs": [[0, "Les trois amis nagèrent vers les profondeurs sombres."], [13, "La lumière du soleil s'estompait peu à peu."], [26, "— Reste près de moi, dit Octave. Ici, tout est différent."], [39, "Des ombres étranges glissaient entre les rochers."], [51, "Soudain, une immense silhouette leur barra la route !"]]}, {"id": "p1_a10", "dur": 60, "subs": [[0, "C'était une baleine bleue, gigantesque et majestueuse."], [14, "— N'ayez pas peur, chanta-t-elle d'une voix grave et douce."], [28, "— Je suis Marina. J'ai senti la venue du nouveau Gardien."], [41, "— La mer s'affaiblit chaque jour. Je vous guiderai vers les abysses."], [53, "Léo grimpa sur son dos immense. Le voyage commençait vraiment."]]}, {"id": "p1_a11", "dur": 60, "subs": [[0, "Marina fendait l'eau noire, portant ses passagers."], [13, "— Autrefois, l'océan était protégé par les Gardiens, dit-elle."], [27, "— Mais le dernier a disparu il y a très longtemps."], [40, "— Depuis, la mer attendait. Elle t'attendait, Léo."], [52, "Léo posa la main sur la peau tiède de la baleine. Il était prêt."]]}, {"id": "p1_a12", "dur": 60, "subs": [[0, "Au loin, une lueur bleue tournoyait dans les ténèbres."], [13, "— Le tourbillon, murmura Octave. C'est là que l'eau disparaît."], [28, "Un courant terrible tirait tout vers son centre."], [40, "— Accrochez-vous ! cria Marina en luttant contre l'aspiration."], [52, "Léo sentit la peur monter. Mais il tint bon."]]}, {"id": "p1_a13", "dur": 60, "subs": [[0, "— Ce tourbillon n'est pas naturel, observa Léo."], [13, "— Tu as raison, dit Coquille. Regarde au centre."], [26, "Une lumière froide et mécanique battait au cœur du gouffre."], [39, "— Une machine, souffla Octave. Quelqu'un a créé ça."], [51, "— Mais qui voudrait vider l'océan ? demanda Léo, révolté."]]}, {"id": "p1_a14", "dur": 60, "subs": [[0, "Marina les mena dans une grotte à l'abri du courant."], [14, "— Reposons-nous. Les abysses sont encore loin."], [27, "Léo regarda ses nouveaux amis, réunis dans la pénombre bleue."], [40, "— Merci de me faire confiance, dit-il doucement."], [51, "— Tu es le Gardien, sourit Coquille. On croit en toi."]]}, {"id": "p1_a15", "dur": 60, "subs": [[0, "— Raconte-moi le Cœur de l'Océan, demanda Léo à Marina."], [14, "— C'est un cristal né avec la première vague du monde."], [29, "— Il bat comme un vrai cœur, et fait vivre toute la mer."], [42, "— S'il s'éteint... l'océan entier s'éteint avec lui."], [53, "Un frisson parcourut le petit groupe."]]}, {"id": "p1_a16", "dur": 60, "subs": [[0, "Soudain, un banc de poissons entra en trombe dans la grotte."], [14, "— Fuyez ! criaient-ils. Les Ombres arrivent !"], [27, "— Les Ombres ? répéta Léo."], [37, "— Les serviteurs de celui qui vide la mer, gronda Octave."], [49, "Dehors, des silhouettes noires aux yeux rouges approchaient."]]}, {"id": "p1_a17", "dur": 60, "subs": [[0, "Les amis s'enfuirent vers un passage étroit."], [13, "Les Ombres les poursuivaient, rapides et silencieuses."], [26, "— Par ici ! guida Octave, se faufilant dans les rochers."], [39, "Léo nageait de toutes ses forces, le cœur battant."], [51, "Le passage débouchait sur un vide immense et noir : l'abysse."]]}, {"id": "p1_a18", "dur": 60, "subs": [[0, "Devant eux s'ouvrait le plus profond de l'océan."], [14, "Des créatures lumineuses flottaient dans l'obscurité."], [28, "— Nous y sommes presque, dit Marina. Le Cœur est tout au fond."], [41, "Mais les Ombres jaillirent de nouveau, plus nombreuses."], [52, "— Elles nous ont retrouvés ! cria Coquille."]]}, {"id": "p1_a19", "dur": 60, "subs": [[0, "Une Ombre gigantesque se dressa devant Léo."], [13, "— Petit Gardien, siffla-t-elle. Fais demi-tour."], [26, "— Mon maître ne laissera personne sauver cet océan."], [39, "Léo serra les poings. — Je n'ai pas peur de toi."], [51, "Une lumière turquoise s'alluma alors dans sa main..."]]}, {"id": "p1_a20", "dur": 60, "subs": [[0, "Le don du Gardien répondit à son courage."], [13, "Un éclat de lumière repoussa les Ombres dans le noir."], [27, "— Tu as réveillé ton pouvoir ! s'exclama Octave, stupéfait."], [40, "Mais au loin, une voix froide résonna dans les abysses :"], [50, "« Bienvenue, Gardien. Nous nous reverrons bientôt... » À SUIVRE."]]}, {"id": "p2_b1", "dur": 60, "subs": [[0, "La voix froide résonnait dans tout l'abysse."], [13, "— Approche, jeune Gardien. Je t'attendais depuis longtemps."], [27, "Au fond des ténèbres, deux lumières mécaniques s'allumèrent."], [40, "— Qui es-tu ? cria Léo, serrant les poings."], [51, "— On m'appelle Abyssus. Et cet océan m'appartient désormais."]]}, {"id": "p2_b2", "dur": 60, "subs": [[0, "Une immense citadelle de métal surgit de l'obscurité."], [14, "Des tuyaux géants aspiraient l'eau de la mer par milliers."], [28, "— C'est lui qui vide l'océan ! comprit Octave, horrifié."], [41, "— Toute cette eau... où l'emmène-t-il ? souffla Coquille."], [52, "— Vers son royaume sec, tout au fond, répondit Marina, grave."]]}, {"id": "p2_b3", "dur": 60, "subs": [[0, "Abyssus apparut : un être de métal aux yeux rouges glaçants."], [14, "— Autrefois, j'étais un simple mécanisme oublié des hommes."], [29, "— Mais j'ai grandi. Et maintenant je veux tout contrôler."], [42, "— Sans le Cœur de l'Océan, la mer mourra. Et tu échoueras."], [53, "— Jamais ! lança Léo. Je le trouverai avant toi !"]]}, {"id": "p2_b4", "dur": 60, "subs": [[0, "Abyssus éclata d'un rire glacial."], [12, "— Trop tard, petit Gardien. J'ai déjà envoyé mes Ombres."], [26, "Des dizaines de silhouettes noires jaillirent des tuyaux."], [39, "— Fuyez ! cria Marina en propulsant ses amis loin de là."], [51, "La citadelle disparut derrière eux dans un nuage sombre."]]}, {"id": "p2_b5", "dur": 60, "subs": [[0, "Ils se réfugièrent dans une faille lumineuse au fond de la mer."], [14, "— On ne peut pas laisser Abyssus gagner, dit Léo, déterminé."], [28, "— Le Cœur est protégé par trois Gardiens anciens, dit Marina."], [41, "— Il faut réunir leurs trois lumières pour l'atteindre."], [52, "— Alors trouvons-les. Un par un, décida Léo."]]}, {"id": "p2_b6", "dur": 60, "subs": [[0, "La première lumière brillait dans un jardin de coraux géants."], [14, "Une vieille murène argentée les y attendait, paisible."], [28, "— Je suis Ondine, gardienne de la Lumière du Courage."], [41, "— Prouve-moi ton courage, Gardien, et la lumière sera tienne."], [52, "— Dis-moi quelle épreuve, répondit Léo sans trembler."]]}, {"id": "p2_b7", "dur": 60, "subs": [[0, "— Un requin blessé rôde, effrayé et furieux, dit Ondine."], [14, "— Les autres le fuient. Va vers lui, sans arme, sans peur."], [28, "Léo s'avança vers le grand requin qui grognait de douleur."], [40, "Une épine noire était plantée dans sa nageoire."], [51, "Doucement, très doucement, Léo la retira."]]}, {"id": "p2_b8", "dur": 60, "subs": [[0, "Le requin cessa de grogner et regarda Léo, apaisé."], [14, "— Merci, Gardien, souffla-t-il. Tu n'avais pas peur de moi."], [27, "Ondine sourit. — Voilà le vrai courage : la douceur."], [40, "Une lumière bleue s'envola vers la main de Léo."], [51, "— La première Lumière est à toi. Deux autres t'attendent."]]}, {"id": "p2_b9", "dur": 60, "subs": [[0, "La deuxième lumière venait d'une vieille épave engloutie."], [14, "Un poisson-lanterne y veillait, seul dans le noir."], [27, "— Je suis Falot, gardien de la Lumière de la Sagesse."], [40, "— Réponds à mon énigme, et la lumière t'appartiendra."], [51, "Léo s'installa, attentif, prêt à réfléchir."]]}, {"id": "p2_b10", "dur": 60, "subs": [[0, "— Plus on m'enlève, plus je deviens grand. Qui suis-je ?"], [15, "Léo réfléchit longuement, les yeux fermés."], [28, "— Un trou ! répondit-il enfin, tout sourire."], [39, "— Exact ! s'écria Falot. La sagesse voit ce qui est caché."], [51, "La deuxième Lumière rejoignit la main de Léo."]]}, {"id": "p2_b11", "dur": 60, "subs": [[0, "La dernière lumière brûlait près d'un volcan sous-marin."], [14, "La chaleur faisait trembler l'eau autour d'eux."], [27, "Un crabe de lave écarlate gardait le passage."], [39, "— Je suis Braise, gardien de la Lumière du Sacrifice."], [51, "— Pour l'obtenir, tu dois donner ce qui t'est le plus cher."]]}, {"id": "p2_b12", "dur": 60, "subs": [[0, "Léo n'avait qu'un seul objet : le pendentif de sa mère."], [14, "Il le tenait depuis toujours. C'était tout son trésor."], [28, "Il hésita... puis le déposa devant le crabe de lave."], [40, "— Prends-le. Sauver l'océan compte plus que tout."], [51, "Braise s'inclina. — Le vrai Gardien sait donner. Voici ta lumière."]]}, {"id": "p2_b13", "dur": 60, "subs": [[0, "La troisième Lumière s'unit aux deux autres dans sa main."], [14, "Mais Braise lui rendit doucement le pendentif."], [27, "— Un cœur qui donne mérite de garder ce qu'il aime."], [39, "Léo serra le pendentif contre lui, ému aux larmes."], [51, "— Maintenant, tu peux réveiller le Cœur de l'Océan."]]}, {"id": "p2_b14", "dur": 60, "subs": [[0, "Les trois lumières unies formaient un éclat éblouissant."], [14, "— Le Cœur est au centre de l'océan, révéla Marina."], [27, "— Là où aucune Ombre n'ose aller. Suivez-moi."], [40, "Ils nagèrent vers un abîme de lumière lointaine."], [51, "Mais soudain, les Ombres const scenes = FILM.map(s => document.getElementById(s.id));
const stEl = document.getElementById('soustitre');
const chEl = document.getElementById('chapitre');
const barre = document.getElementById('barrePlein');
const TOTAL = FILM.reduce((a,s)=>a+s.dur,0);

let idx=0, t=0, timer=null, enPause=false;

function tic(){
  const sc = FILM[idx];
  scenes.forEach((el,i)=>el.classList.toggle('on', i===idx));
  chEl.textContent = 'Chapitre '+(idx+1)+' / '+FILM.length;
  let cur='';
  for(const [ts,txt] of sc.subs){ if(t>=ts) cur=txt; }
  if(stEl.textContent!==cur){
    stEl.textContent=cur;
    stEl.classList.remove('on'); void stEl.offsetWidth; stEl.classList.add('on');
  }
  let ecoule=0; for(let i=0;i<idx;i++) ecoule+=FILM[i].dur; ecoule+=t;
  barre.style.width = (ecoule/TOTAL*100)+'%';
  t++;
  if(t>=sc.dur){ t=0; idx++; if(idx>=FILM.length){ terminer(); return; } }
}
function demarrer(){
  document.getElementById('accueil').style.display='none';
  document.getElementById('fin').style.display='none';
  document.getElementById('lecteur').style.display='flex';
  idx=0; t=0; enPause=false;
  document.getElementById('pausebtn').textContent='⏸';
  if(timer) clearInterval(timer);
  timer=setInterval(()=>{ if(!enPause) tic(); }, 1000);
  tic();
}
function terminer(){
  clearInterval(timer); timer=null;
  document.getElementById('lecteur').style.display='none';
  stEl.classList.remove('on');
  document.getElementById('fin').style.display='flex';
}
function passer(){ if(idx<FILM.length){ t=0; idx++; if(idx>=FILM.length){ terminer(); return; } tic(); } }

document.getElementById('play').onclick=demarrer;
document.getElementById('rejouer').onclick=demarrer;
document.getElementById('pausebtn').onclick=function(){ enPause=!enPause; this.textContent=enPause?'▶':'⏸'; };
document.getElementById('nextbtn').onclick=passer;
</script>
