  .playbtn{margin-top:28px;padding:14px 40px;border:none;border-radius:40px;cursor:pointer;

  /* ===== SCÈNE ===== */
  #film{position:relative;width:min(100vw,860px);aspect-ratio:16/10;max-height:100vh;
    border-radius:14px;overflow:hidden;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.7);}
  svg.scene{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .8s;}
  svg.scene.on{opacity:1;}

  /* sous-titres */
  #sub{position:absolute;left:0;right:0;bottom:5%;text-align:center;z-index:20;padding:0 8%;

  /* barre de progression */
  #barwrap{position:absolute;left:0;right:0;top:0;height:5px;background:rgba(255,255,255,.12);z-index:25;}
  #bar{height:100%;width:0;background:linear-gradient(90deg,#ff5a5a,#ffd36b);transition:width .2s linear;}

  /* boutons de contrôle */
  #ctrl{position:absolute;top:10px;right:12px;z-index:25;display:flex;gap:8px;}
  #ctrl button{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);color:#fff;
    border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;}

  /* ===== ÉCRAN DE FIN ===== */
  #end{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#2a1145,#0a0416 70%);text-align:center;padding:24px;}
  #end.on{display:flex;}
  #end h2{font-size:clamp(24px,7vw,44px);font-weight:900;
    background:linear-gradient(180deg,#fff,#ffd7a0,#ff9d4d);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #end p{color:#ddd;margin-top:14px;font-size:clamp(14px,3.6vw,19px);line-height:1.5;max-width:600px;}
  #end .again{margin-top:26px;padding:12px 34px;border:none;border-radius:36px;cursor:pointer;

  /* ===== ANIMATIONS DE SCÈNE ===== */
  .star{fill:#fff;animation:tw 3s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.25;}50%{opacity:.95;}}
  .float{transform-box:fill-box;transform-origin:center;animation:fl 3.4s ease-in-out infinite;}
  @keyframes fl{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
  .float.d1{animation-delay:.4s;} .float.d2{animation-delay:.9s;} .float.d3{animation-delay:1.4s;}
  .flame{transform-box:fill-box;transform-origin:bottom;animation:flk .5s ease-in-out infinite;}

  .spin{transform-box:fill-box;transform-origin:center;animation:sp 8s linear infinite;}

  @keyframes rise{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}

<script>
// ====== SCRIPT DU FILM ======
// Chaque scène a une durée, et des sous-titres avec leur temps d'apparition (en dixièmes de seconde).
const SCENES = [
  { id:'s1', chap:'Chapitre 1 · La forêt paisible', dur:420, subs:[
    [8,"Il était une fois une forêt où vivaient quatre animaux très spéciaux..."],
    [70,"🔥 Blaze, le renard de feu. Courageux, fougueux, toujours le premier à foncer."],
    [150,"Chacun vivait seul, sans connaître les trois autres."],
    [230,"« Une belle journée de plus », soupira Blaze en regardant le soleil."],
    [320,"Mais ce soir-là, quelque chose d'étrange allait tout changer..."]
  ]},
  { id:'s2', chap:'Chapitre 2 · L\'ombre', dur:440, subs:[
    [8,"Le ciel s'assombrit d'un coup. Le vent se glaça."],
    [90,"Une immense ombre aux yeux violets apparut au-dessus de la forêt."],
    [190,"« Je suis Nyx... et bientôt, plus aucune lumière ne brillera. »"],
    [300,"Puis l'ombre disparut, aussi vite qu'elle était venue."],
    [370,"Mais elle avait laissé quelque chose derrière elle..."]
  ]},
  { id:'s3', chap:'Chapitre 3 · La rencontre', dur:460, subs:[
    [8,"Effrayés, les quatre animaux coururent vers la clairière..."],
    [90,"🔥 Blaze le renard. 💧 Onda la loutre. 🌍 Roc la tortue. 💨 Zéphyr l'oiseau."],
    [210,"Pour la première fois, ils se retrouvaient tous les quatre."],
    [310,"« On dirait que le danger nous a réunis », dit Onda avec calme."],
    [390,"Chacun sentait au fond de lui un pouvoir qu'il ne connaissait pas encore."]
  ]},
  { id:'s4', chap:'Chapitre 4 · Le premier monstre', dur:460, subs:[
    [8,"Soudain, l'ombre laissée par Nyx prit vie : un monstre !"],
    [100,"Blaze lança une flamme. Onda projeta une vague. Le monstre recula !"],
    [220,"« Ensemble... on est plus forts ! », cria Zéphyr en tournoyant."],
    [330,"Roc dressa un bouclier de terre pour protéger ses nouveaux amis."],
    [400,"Le monstre d'ombre éclata en mille poussières."]
  ]},
  { id:'s5', chap:'Chapitre 5 · Le Clan est né', dur:360, subs:[
    [8,"Au centre de la clairière, un symbole de lumière apparut : le R."],
    [90,"Feu, Eau, Terre, Air... les quatre éléments réunis en un seul clan."],
    [190,"« Nous sommes le Clan des 4 Éléments ! », déclarèrent-ils ensemble."],
    [270,"Mais très loin de là, dans le noir, deux yeux violets les observaient encore..."],
    [330,"L'aventure ne fait que commencer. 🔥💧🌍💨"]
  ]}
];

let si=0;            // index scène
let t=0;             // temps dans la scène (dixièmes)
let subIdx=0;
let paused=false;
let timer=null;
let totalDur = SCENES.reduce((a,s)=>a+s.dur,0);
let elapsedBefore=0;

const $ = id => document.getElementById(id);

function demarrer(){
  $('intro').style.display='none';
  $('film').style.display='block';
  si=0; t=0; subIdx=0; elapsedBefore=0;
  showScene();
  timer=setInterval(tic,100);
}

function showScene(){
  document.querySelectorAll('.scene').forEach(e=>e.classList.remove('on'));
  const sc=SCENES[si];
  $(sc.id).classList.add('on');
  $('chap').textContent=sc.chap;
  $('sub').textContent='';
  subIdx=0;
}

function tic(){
  if(paused) return;
  t++;
  const sc=SCENES[si];
  // sous-titres
  while(subIdx<sc.subs.length && t>=sc.subs[subIdx][0]){
    $('sub').textContent=sc.subs[subIdx][1];
    subIdx++;
  }
  // barre de progression
  const done=elapsedBefore+t;
  $('bar').style.width=Math.min(100,(done/totalDur)*100)+'%';
  // fin de scène
  if(t>=sc.dur){
    elapsedBefore+=sc.dur;
    si++;
    t=0;
    if(si>=SCENES.length){ finir(); return; }
    showScene();
  }
}

function togglePause(){
  paused=!paused;
  $('pauseBtn').textContent=paused?'▶ Lecture':'⏸ Pause';
}

function finir(){
  clearInterval(timer);
  $('film').style.display='none';
  $('endtext').innerHTML="Le Clan des 4 Éléments est né !<br>Nyx prépare déjà son prochain monstre...<br>Rendez-vous à l'épisode 2 ! 👀";
  $('end').classList.add('on');
}
</script>
