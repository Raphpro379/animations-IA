<script>
const SCENES = [
  { id:'s1', chap:"Chapitre 1 · Sur la piste", dur:590, subs:[[8,"Le clan suivait les indices vers la Flamme Éternelle."],[100,"« La légende parle d'un temple caché dans les montagnes. »"],[220,"Mais Rozéa avait déjà envoyé un de ses généraux ranimés."],[340,"Givros, revenu d'entre les glaces, barra la route au clan."]]},
  { id:'s2', chap:"Chapitre 2 · Givros ranimé", dur:600, subs:[[8,"« Vous ne passerez pas ! », gronda Givros de sa voix glacée."],[100,"« Grâce à Rozéa, je suis de retour, plus fort que jamais ! »"],[220,"Rozéa observait depuis les hauteurs, un sourire malin aux lèvres."],[340,"« Montre-leur ta puissance, Givros ! », ricana-t-elle."]]},
  { id:'s3', chap:"Chapitre 3 · Le combat glacé", dur:600, subs:[[8,"« Cette fois, on sait comment le battre ! », cria Blaze."],[100,"Le clan combina feu et vent pour repousser le froid."],[220,"« Ta glace ne nous fait plus peur, Givros ! », lança Zéphyr."],[340,"Le général ranimé recula sous les assauts du clan."]]},
  { id:'s4', chap:"Chapitre 4 · Givros géant", dur:610, subs:[[8,"« Vous m'avez déjà vaincu... mais pas cette fois ! DEVIENS GÉANT ! »"],[110,"Givros grandit en un colosse de glace ranimé. 😱"],[230,"« On l'a déjà fait tomber une fois. On recommence ! », dit Onda."],[340,"« COMBO DES 4 ÉLÉMENTS ! »"]]},
  { id:'s5', chap:"Chapitre 5 · Le deuxième indice", dur:600, subs:[[8,"🔥 FEU ! 💧 EAU ! 🌍 TERRE ! 💨 AIR !"],[90,"Le R géant repoussa Givros dans un éclat de lumière ! 💥"],[190,"Mais Rozéa le fit disparaître avant qu'il soit détruit : « Pas encore ! »"],[290,"Dans le temple libéré, le clan trouva le deuxième indice."],[400,"La Flamme grandit un peu plus. « On se rapproche ! », sourit Roc. ✨"]]}
];
const MACHINE_PCT = 50;
let si=0,t=0,subIdx=0,paused=false,timer=null;
let totalDur=SCENES.reduce((a,s)=>a+s.dur,0),elapsedBefore=0;
const $=id=>document.getElementById(id);
function demarrer(){
  $('intro').style.display='none';$('film').style.display='block';
  si=0;t=0;subIdx=0;elapsedBefore=0;showScene();
  setTimeout(()=>{$('mfill').style.width=MACHINE_PCT+'%';},400);
  timer=setInterval(tic,100);
}
function showScene(){
  document.querySelectorAll('.scene').forEach(e=>e.classList.remove('on'));
  const sc=SCENES[si];$(sc.id).classList.add('on');$('chap').textContent=sc.chap;$('sub').textContent='';subIdx=0;
}
function tic(){
  if(paused)return;t++;const sc=SCENES[si];
  while(subIdx<sc.subs.length&&t>=sc.subs[subIdx][0]){$('sub').textContent=sc.subs[subIdx][1];subIdx++;}
  const done=elapsedBefore+t;$('bar').style.width=Math.min(100,(done/totalDur)*100)+'%';
  if(t>=sc.dur){elapsedBefore+=sc.dur;si++;t=0;if(si>=SCENES.length){finir();return;}showScene();}
}
function togglePause(){paused=!paused;$('pauseBtn').textContent=paused?'▶ Lecture':'⏸ Pause';}
function finir(){
  clearInterval(timer);$('film').style.display='none';
  $('endtext').innerHTML="Givros repoussé, la Flamme Éternelle grandit !<br>Mais Rozéa protège encore ses généraux...<br>Rendez-vous à l'épisode 3 ! 🌸✨";
  $('end').classList.add('on');
}
</script>
