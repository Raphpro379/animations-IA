    border-radius:14px;overflow:hidden;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.7);}
  svg.scene{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .8s;}
  svg.scene.on{opacity:1;}

  .float.d1{animation-delay:.4s;}.float.d2{animation-delay:.9s;}.float.d3{animation-delay:1.4s;}

  .nyxeye{transform-box:fill-box;transform-origin:center;animation:eye 2s ease-in-out infinite;}
  @keyframes eye{0%,100%{opacity:.55;}50%{opacity:1;}}
  .spin{transform-box:fill-box;transform-origin:center;animation:sp 8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .fastspin{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite;}
  .glowpulse{animation:gp 2.4s ease-in-out infinite;}
  @keyframes gp{0%,100%{opacity:.4;}50%{opacity:.9;}}
  .shake{transform-box:fill-box;transform-origin:center;animation:shk .3s ease-in-out infinite;}
  @keyframes shk{0%,100%{transform:translate(0,0);}25%{transform:translate(-4px,2px);}75%{transform:translate(4px,-2px);}}

  @keyframes bshk{0%,100%{transform:translate(0,0);}25%{transform:translate(-7px,4px);}75%{transform:translate(7px,-4px);}}

  @keyframes boomp{0%{transform:scale(.6);opacity:0;}30%{opacity:1;}100%{transform:scale(1.7);opacity:0;}}
  .zap{stroke-dasharray:6 6;animation:zapmove .3s linear infinite;}
  @keyframes zapmove{to{stroke-dashoffset:-24;}}
  .crumble{transform-box:fill-box;transform-origin:center;animation:crmb 2s ease-in forwards;}
  @keyframes crmb{0%{opacity:1;transform:scale(1) rotate(0);}100%{opacity:0;transform:scale(.4) rotate(30deg);}}
  .fadein{animation:fadein 3s ease-in forwards;}
  @keyframes fadein{from{opacity:0;}to{opacity:1;}}
  .frost{animation:frostpulse 2.5s ease-in-out infinite;}
  @keyframes frostpulse{0%,100%{opacity:.4;}50%{opacity:.9;}}
  .snow{animation:snowfall linear infinite;}
  @keyframes snowfall{from{transform:translateY(-20px);}to{transform:translateY(560px);}}
  .buildpulse{transform-box:fill-box;transform-origin:center;animation:bp 1.5s ease-in-out infinite;}

<script>
const SCENES = [
  { id:'s1', chap:"Chapitre 1 · La Flamme Éternelle", dur:425, subs:[[8,"Le jour du destin était arrivé. La Flamme brûlait devant le clan."],[100,"« Il est temps. Prenons la Flamme Éternelle, tous ensemble ! »"],[220,"Mais Rozéa surgit avec ses deux généraux ranimés à ses côtés."],[330,"« Vous ne toucherez jamais cette Flamme ! », cria-t-elle."]]},
  { id:'s2', chap:"Chapitre 2 · Trois contre quatre", dur:428, subs:[[8,"Rozéa, Krâne-Fer et Givros attaquèrent en même temps."],[100,"Le clan tenait bon, mais les trois généraux étaient trop puissants."],[220,"« La Flamme... c'est notre seule chance ! Couvrez-moi ! », dit Blaze."],[330,"Zéphyr fila comme l'éclair pour protéger son ami."]]},
  { id:'s3', chap:"Chapitre 3 · Le sacrifice de Zéphyr", dur:430, subs:[[8,"Zéphyr créa un tourbillon pour repousser les trois généraux."],[100,"« Vas-y Blaze ! Prends la Flamme, je les retiens ! »"],[220,"Blaze courut vers l'autel pendant que ses amis se battaient."],[330,"« Tiens bon, Zéphyr ! J'y suis presque ! »"]]},
  { id:'s4', chap:"Chapitre 4 · La Flamme s'éveille", dur:430, subs:[[8,"Blaze posa ses pattes sur la Flamme Éternelle."],[100,"« Flamme ancienne, prête-nous ta force pour vaincre le mal ! »"],[200,"La Flamme s'embrasa d'une lumière éblouissante ! ✨"],[300,"« ELLE EST RÉVEILLÉE ! On a enfin la force qu'il nous fallait ! »"],[400,"Blaze rejoignit ses amis, la Flamme Éternelle dans le cœur."]]},
  { id:'s5', chap:"Chapitre 5 · Le combo de la Flamme", dur:430, subs:[[8,"Le clan unit ses pouvoirs, décuplés par la Flamme Éternelle."],[100,"🔥 FEU ! 💧 EAU ! 🌍 TERRE ! 💨 AIR ! + FLAMME ÉTERNELLE !"],[210,"« COMBO ÉTERNEL... PUISSANCE ABSOLUE ! »"],[310,"Un R de lumière pure engloutit les trois généraux ! 💥"],[410,"Cette fois, aucune ruse ne pourrait les ramener."]]},
  { id:'s6', chap:"Chapitre 6 · La fin des généraux", dur:428, subs:[[8,"La Flamme Éternelle consuma les trois généraux à la fois."],[100,"« IMPOSSIBLE... même moi, la plus rusée... vaincue ! », cria Rozéa."],[210,"Krâne-Fer, Givros et Rozéa furent détruits pour toujours ! 💥"],[310,"« On a réussi ! Cette fois, ils ne reviendront plus jamais ! »"],[410,"Le clan avait vaincu les trois généraux de Nyx !"]]},
  { id:'s7', chap:"Chapitre 7 · Nyx entre en scène...", dur:429, subs:[[8,"Très loin, au plus profond du Néant, Nyx serra les poings d'ombre."],[100,"« Mes trois généraux... tous détruits par ces animaux. »"],[210,"« Je ne peux plus compter sur personne d'autre. »"],[310,"« Cette fois, je m'occuperai d'eux MOI-MÊME ! »"],[410,"La Saison 4 : le combat final contre Nyx arrive... 🌑⚡"]]}
];
const MACHINE_PCT = 100;
let si=0,t=0,subIdx=0,paused=false,timer=null;
let totalDur=SCENES.reduce((a,s)=>a+s.dur,0),elapsedBefore=0;
const $=id=>document.getElementById(id);
function demarrer(){
  $('intro').style.display='none';$('film').style.display='block';
  si=0;t=0;subIdx=0;elapsedBefore=0;showScene();
  setTimeout(()=>{$('mfill').style.width=MACHINE_PCT+'%';},400);
  timer=setInterval(tic,100);
}
function showScene(){
  document.querySelectorAll('.scene').forEach(e=>e.classList.remove('on'));
  const sc=SCENES[si];$(sc.id).classList.add('on');$('chap').textContent=sc.chap;$('sub').textContent='';subIdx=0;
}
function tic(){
  if(paused)return;t++;const sc=SCENES[si];
  while(subIdx<sc.subs.length&&t>=sc.subs[subIdx][0]){$('sub').textContent=sc.subs[subIdx][1];subIdx++;}
  const done=elapsedBefore+t;$('bar').style.width=Math.min(100,(done/totalDur)*100)+'%';
  if(t>=sc.dur){elapsedBefore+=sc.dur;si++;t=0;if(si>=SCENES.length){finir();return;}showScene();}
}
function togglePause(){paused=!paused;$('pauseBtn').textContent=paused?'▶ Lecture':'⏸ Pause';}
function finir(){
  clearInterval(timer);$('film').style.display='none';
  $('endtext').innerHTML="Grâce à la Flamme Éternelle, le Clan a détruit les trois généraux ! ✨<br>Il ne reste plus qu'un ennemi : NYX lui-même.<br><b>La Saison 4, le grand final, arrive bientôt !</b> 🌑";
  $('end').classList.add('on');
}
</script>
