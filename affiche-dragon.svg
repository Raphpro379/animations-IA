<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <!-- Ciel coucher de soleil -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0d2e"/>
      <stop offset="25%" stop-color="#4a1e4d"/>
      <stop offset="50%" stop-color="#a83a4d"/>
      <stop offset="72%" stop-color="#e86a3a"/>
      <stop offset="88%" stop-color="#ffb84d"/>
      <stop offset="100%" stop-color="#ffd98a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5d0"/>
      <stop offset="40%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a4d" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#ff8a4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtn1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2438"/>
      <stop offset="100%" stop-color="#1a0f22"/>
    </linearGradient>
    <linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a2a3d"/>
      <stop offset="100%" stop-color="#2a1522"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1518"/>
      <stop offset="100%" stop-color="#0a0508"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="45%" stop-color="#ffd98a"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="emberBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a4d"/>
      <stop offset="100%" stop-color="#e0451d"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softbig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="titleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".6"/>
    </filter>
  </defs>

  <!-- CIEL -->
  <rect width="800" height="1200" fill="url(#sky)"/>

  <!-- Étoiles (haut) -->
  <g fill="#fff">
    <circle cx="90" cy="70" r="2" opacity=".9"/>
    <circle cx="200" cy="130" r="1.5" opacity=".7"/>
    <circle cx="330" cy="60" r="2" opacity=".8"/>
    <circle cx="480" cy="110" r="1.5" opacity=".6"/>
    <circle cx="620" cy="70" r="2.2" opacity=".9"/>
    <circle cx="720" cy="140" r="1.5" opacity=".7"/>
    <circle cx="150" cy="200" r="1.5" opacity=".5"/>
    <circle cx="680" cy="210" r="1.8" opacity=".7"/>
    <circle cx="410" cy="180" r="1.3" opacity=".5"/>
  </g>

  <!-- Soleil -->
  <circle cx="400" cy="620" r="230" fill="url(#sun)"/>
  <circle cx="400" cy="620" r="120" fill="#fff0c8" opacity=".55"/>

  <!-- Montagnes arrière -->
  <path d="M0 720 L120 560 L240 700 L360 520 L480 690 L620 540 L760 700 L800 660 L800 760 L0 760 Z" fill="url(#mtn2)" opacity=".85"/>
  <!-- neige sommets arrière -->
  <path d="M360 520 L332 560 L390 560 Z" fill="#ffd9a0" opacity=".5"/>
  <path d="M620 540 L596 576 L648 576 Z" fill="#ffd9a0" opacity=".5"/>

  <!-- Montagnes avant -->
  <path d="M0 800 L160 600 L300 780 L440 590 L600 790 L760 620 L800 700 L800 900 L0 900 Z" fill="url(#mtn1)"/>
  <path d="M440 590 L410 640 L474 640 Z" fill="#ffcf9a" opacity=".6"/>
  <path d="M160 600 L132 648 L192 648 Z" fill="#ffcf9a" opacity=".5"/>

  <!-- Halo derrière le dragon -->
  <circle cx="470" cy="440" r="200" fill="url(#glow)" filter="url(#softbig)"/>

  <!-- ===== DRAGONS AU LOIN (la famille) ===== -->
  <g opacity=".55" fill="#2a1522">
    <g transform="translate(120,300) scale(.5)">
      <path d="M0 0 Q-45 -30 -80 -10 Q-45 5 -20 8 Q-45 30 -70 55 Q-30 35 0 22 Q30 35 70 55 Q45 30 20 8 Q45 5 80 -10 Q45 -30 0 0 Z"/>
    </g>
    <g transform="translate(660,250) scale(.42)">
      <path d="M0 0 Q-45 -30 -80 -10 Q-45 5 -20 8 Q-45 30 -70 55 Q-30 35 0 22 Q30 35 70 55 Q45 30 20 8 Q45 5 80 -10 Q45 -30 0 0 Z"/>
    </g>
    <g transform="translate(230,180) scale(.32)">
      <path d="M0 0 Q-45 -30 -80 -10 Q-45 5 -20 8 Q-45 30 -70 55 Q-30 35 0 22 Q30 35 70 55 Q45 30 20 8 Q45 5 80 -10 Q45 -30 0 0 Z"/>
    </g>
  </g>

  <!-- ===== EMBER LE DRAGON (héros, en vol) ===== -->
  <g transform="translate(470,430)">
    <!-- Aile gauche déployée -->
    <path d="M-40 -30 Q-190 -120 -230 20 Q-140 -30 -70 10 Z" fill="url(#emberBody)"/>
    <path d="M-40 -30 Q-165 -95 -205 5 M-40 -10 Q-130 -35 -75 8" stroke="#c0391a" stroke-width="4" fill="none" opacity=".6"/>
    <!-- Aile droite déployée -->
    <path d="M40 -30 Q190 -120 230 20 Q140 -30 70 10 Z" fill="url(#emberBody)"/>
    <path d="M40 -30 Q165 -95 205 5 M40 -10 Q130 -35 75 8" stroke="#c0391a" stroke-width="4" fill="none" opacity=".6"/>
    <!-- Queue -->
    <path d="M20 90 Q90 130 70 190 Q50 140 5 120 Z" fill="url(#emberBody)"/>
    <!-- Corps -->
    <ellipse cx="0" cy="55" rx="52" ry="60" fill="url(#emberBody)"/>
    <ellipse cx="0" cy="65" rx="32" ry="42" fill="#ffe0b0"/>
    <!-- Tête -->
    <circle cx="0" cy="-5" r="46" fill="url(#emberBody)"/>
    <!-- Cornes -->
    <path d="M-24 -40 L-32 -74 L-12 -46 Z" fill="#ffd36b"/>
    <path d="M24 -40 L32 -74 L12 -46 Z" fill="#ffd36b"/>
    <!-- Yeux -->
    <ellipse cx="-16" cy="-6" rx="12" ry="14" fill="#fff"/>
    <ellipse cx="16" cy="-6" rx="12" ry="14" fill="#fff"/>
    <circle cx="-15" cy="-4" r="7" fill="#2a1500"/>
    <circle cx="17" cy="-4" r="7" fill="#2a1500"/>
    <circle cx="-12" cy="-8" r="2.5" fill="#fff"/>
    <circle cx="20" cy="-8" r="2.5" fill="#fff"/>
    <!-- Museau -->
    <ellipse cx="0" cy="18" rx="16" ry="11" fill="#ffe0b0"/>
    <circle cx="-6" cy="16" r="2.4" fill="#3a1500"/>
    <circle cx="6" cy="16" r="2.4" fill="#3a1500"/>
    <!-- petite flamme -->
    <path d="M0 30 Q-14 55 0 82 Q14 55 0 30 Z" fill="#ffb84d" opacity=".9"/>
    <path d="M0 40 Q-7 56 0 74 Q7 56 0 40 Z" fill="#fff0c0"/>
  </g>

  <!-- ===== TIM (au sol, silhouette regardant vers le haut) ===== -->
  <g transform="translate(360,820)">
    <!-- ombre -->
    <ellipse cx="30" cy="120" rx="70" ry="14" fill="#000" opacity=".4"/>
    <!-- jambes -->
    <rect x="18" y="70" width="12" height="48" rx="5" fill="#2a1a10"/>
    <rect x="36" y="70" width="12" height="48" rx="5" fill="#2a1a10"/>
    <!-- corps tunique -->
    <path d="M12 24 Q33 16 54 24 L50 76 Q33 82 16 76 Z" fill="#2d6a3d"/>
    <!-- bras levé vers le dragon -->
    <path d="M50 30 Q78 6 92 -18" stroke="#e8b888" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="8" y="32" width="10" height="36" rx="5" fill="#e8b888"/>
    <!-- tête -->
    <circle cx="33" cy="6" r="20" fill="#f0c398"/>
    <path d="M13 4 Q15 -18 33 -18 Q51 -18 53 4 Q45 -6 33 -6 Q21 -6 13 4 Z" fill="#5a3a1e"/>
  </g>

  <!-- Sol -->
  <path d="M0 900 Q400 875 800 900 L800 1200 L0 1200 Z" fill="url(#ground)"/>

  <!-- étincelles qui montent -->
  <g fill="#ffb84d">
    <circle cx="430" cy="770" r="3" opacity=".9"/>
    <circle cx="470" cy="720" r="2.4" opacity=".7"/>
    <circle cx="410" cy="700" r="2" opacity=".6"/>
    <circle cx="500" cy="800" r="2.6" opacity=".8"/>
    <circle cx="380" cy="740" r="1.8" opacity=".5"/>
    <circle cx="520" cy="740" r="2" opacity=".6"/>
  </g>

  <!-- ===== TEXTE ===== -->
  <!-- bandeau haut -->
  <text x="400" y="1000" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="8" fill="#ffe0a8" opacity=".9">CINÉÈR PRÉSENTE</text>

  <!-- TITRE -->
  <text x="400" y="1068" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="72" fill="url(#title)" filter="url(#titleShadow)" letter-spacing="1">LE DERNIER</text>
  <text x="400" y="1140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="72" fill="url(#title)" filter="url(#titleShadow)" letter-spacing="1">ŒUF DE DRAGON</text>

  <!-- sous-titre -->
  <text x="400" y="1180" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="3" fill="#ffd9a0" opacity=".85" font-style="italic">Une amitié plus grande que le ciel</text>
</svg>
