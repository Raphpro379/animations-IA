  .crumble{transform-box:fill-box;transform-origin:center;animation:crmb 2s ease-in forwards;}

<script>
const SCENES = [
  { id:'s1', chap:"Chapitre 1 · La piste de Kraal", dur:590, subs:[[8,"« BIP, tu as trouvé où se cache Kraal ? », demanda Nova."],[100,"« Affirmatif ! Sa trace mène à Glacia, la planète de glace ! »"],[220,"« Alors mettons le cap sur Glacia. Vitesse maximale ! »"],[340,"Le Comète fila vers une planète blanche et scintillante."]]},
  { id:'s2', chap:"Chapitre 2 · La planète de glace", dur:600, subs:[[8,"Sur Glacia, tout n'était que glace, neige et silence."],[100,"Nova avança prudemment, ses bottes crissant sur le givre."],[220,"« Kraal est venu voler les cristaux de glace, c'est sûr. »"],[340,"« Reste sur tes gardes, BIP. Ce pirate est rusé. »"]]},
  { id:'s3', chap:"Chapitre 3 · Face à face", dur:600, subs:[[8,"Soudain, une silhouette imposante émergea de la tempête de neige."],[100,"« Tiens, tiens... une petite exploratrice qui me cherche ? »"],[220,"« Capitaine Kraal ! Vos pillages s'arrêtent aujourd'hui ! », cria Nova."],[340,"« Ha ! Personne n'a jamais arrêté le grand Kraal. Personne ! »"]]},
  { id:'s4', chap:"Chapitre 4 · La poursuite glacée", dur:610, subs:[[8,"Kraal s'enfuit vers son vaisseau avec un sac de cristaux volés."],[110,"« Reviens ici, pirate ! », hurla Nova en le poursuivant."],[230,"Ils glissèrent et coururent sur la glace, entre les pics gelés."],[340,"Kraal était rapide, mais Nova ne lâchait rien."]]},
  { id:'s5', chap:"Chapitre 5 · Il s'échappe", dur:600, subs:[[8,"Kraal atteignit son vaisseau et décolla dans un rugissement."],[100,"« À la prochaine, exploratrice ! Tu ne m'attraperas jamais ! »"],[200,"Mais dans sa fuite, il laissa tomber un cristal d'énergie."],[300,"« Un cristal ! Avec ça, je peux améliorer le Comète, BIP ! »"],[420,"« Premier cristal récupéré. On se rapproche de toi, Kraal. » 💎"]]}
];
const MACHINE_PCT = 40;
let si=0,t=0,subIdx=0,paused=false,timer=null;
let totalDur=SCENES.reduce((a,s)=>a+s.dur,0),elapsedBefore=0;
const $=id=>document.getElementById(id);
function demarrer(){
  $('intro').style.display='none';$('film').style.display='block';
  si=0;t=0;subIdx=0;elapsedBefore=0;showScene();
  setTimeout(()=>{$('mfill').style.width=MACHINE_PCT+'%';},400);
  timer=setInterval(tic,100);
}
function showScene(){
  document.querySelectorAll('.scene').forEach(e=>e.classList.remove('on'));
  const sc=SCENES[si];$(sc.id).classList.add('on');$('chap').textContent=sc.chap;$('sub').textContent='';subIdx=0;
}
function tic(){
  if(paused)return;t++;const sc=SCENES[si];
  while(subIdx<sc.subs.length&&t>=sc.subs[subIdx][0]){$('sub').textContent=sc.subs[subIdx][1];subIdx++;}
  const done=elapsedBefore+t;$('bar').style.width=Math.min(100,(done/totalDur)*100)+'%';
  if(t>=sc.dur){elapsedBefore+=sc.dur;si++;t=0;if(si>=SCENES.length){finir();return;}showScene();}
}
function togglePause(){paused=!paused;$('pauseBtn').textContent=paused?'▶ Lecture':'⏸ Pause';}
function finir(){
  clearInterval(timer);$('film').style.display='none';
  $('endtext').innerHTML="Kraal s'est échappé, mais Nova a récupéré un cristal d'énergie !<br>Le Comète devient plus rapide...<br>Rendez-vous à l'épisode 3 ! 🚀💎";
  $('end').classList.add('on');
}
</script>
