<script>
const SCENES = [
  { id:'s1', chap:"Chapitre 1 · Le repaire de Kraal", dur:590, subs:[[8,"En suivant la piste, Nova découvrit le repaire secret de Kraal."],[100,"Un astéroïde sombre, rempli de cristaux volés à toute la galaxie."],[220,"« Regarde tout ça, BIP. Il a pillé des dizaines de planètes ! »"],[340,"« Il doit avoir un plan. Personne ne vole autant sans raison. »"]]},
  { id:'s2', chap:"Chapitre 2 · Le plan secret", dur:600, subs:[[8,"Nova s'infiltra et découvrit un document holographique."],[100,"« Le Cristal-Roi... l'énergie la plus puissante de la galaxie ! »"],[220,"« Kraal veut réunir tous les cristaux pour le créer ! »"],[340,"« Avec ça, il pourrait dominer toutes les planètes ! C'est terrible ! »"]]},
  { id:'s3', chap:"Chapitre 3 · Découverte", dur:600, subs:[[8,"« Qui ose entrer dans mon repaire ?! », rugit Kraal, furieux."],[100,"« Je connais ton plan, Kraal ! Tu ne créeras jamais ce Cristal-Roi ! »"],[220,"« Trop tard, exploratrice ! Il ne me manque qu'UN seul cristal ! »"],[340,"« Et je sais exactement où le trouver... sur ta prochaine étape ! »"]]},
  { id:'s4', chap:"Chapitre 4 · La course au dernier cristal", dur:610, subs:[[8,"Kraal fonça vers son vaisseau. « Le dernier cristal sera à moi ! »"],[110,"« Pas si je l'atteins avant toi ! », cria Nova en le poursuivant."],[230,"Les deux vaisseaux filèrent dans l'espace, côte à côte."],[340,"C'était une course contre la montre pour sauver la galaxie."]]},
  { id:'s5', chap:"Chapitre 5 · Le troisième cristal", dur:600, subs:[[8,"Nova atteignit la planète et récupéra le cristal avant Kraal !"],[100,"« NON ! », hurla le pirate, fou de rage."],[200,"« Trois cristaux, BIP ! Le Comète est au maximum de sa puissance ! »"],[300,"« Maintenant je peux le rattraper. Direction : le combat final ! »"],[420,"« Prépare-toi, Kraal. Notre affrontement approche. » 💎💎💎"]]}
];
const MACHINE_PCT = 90;
let si=0,t=0,subIdx=0,paused=false,timer=null;
let totalDur=SCENES.reduce((a,s)=>a+s.dur,0),elapsedBefore=0;
const $=id=>document.getElementById(id);
function demarrer(){
  $('intro').style.display='none';$('film').style.display='block';
  si=0;t=0;subIdx=0;elapsedBefore=0;showScene();
  setTimeout(()=>{$('mfill').style.width=MACHINE_PCT+'%';},400);
  timer=setInterval(tic,100);
}
function showScene(){
  document.querySelectorAll('.scene').forEach(e=>e.classList.remove('on'));
  const sc=SCENES[si];$(sc.id).classList.add('on');$('chap').textContent=sc.chap;$('sub').textContent='';subIdx=0;
}
function tic(){
  if(paused)return;t++;const sc=SCENES[si];
  while(subIdx<sc.subs.length&&t>=sc.subs[subIdx][0]){$('sub').textContent=sc.subs[subIdx][1];subIdx++;}
  const done=elapsedBefore+t;$('bar').style.width=Math.min(100,(done/totalDur)*100)+'%';
  if(t>=sc.dur){elapsedBefore+=sc.dur;si++;t=0;if(si>=SCENES.length){finir();return;}showScene();}
}
function togglePause(){paused=!paused;$('pauseBtn').textContent=paused?'▶ Lecture':'⏸ Pause';}
function finir(){
  clearInterval(timer);$('film').style.display='none';
  $('endtext').innerHTML="Nova connaît le plan de Kraal et a récupéré le troisième cristal !<br>Le Comète est prêt pour l'affrontement final...<br>LE GRAND FINAL à l'épisode 5 ! 🚀💎";
  $('end').classList.add('on');
}
</script>
