<script>
const SCENES = [
  { id:'s1', chap:"Chapitre 1 · Le duel des vaisseaux", dur:425, subs:[[8,"Le combat final commença dans une pluie d'étoiles."],[90,"Le Comète et le vaisseau pirate se livrèrent un duel spatial."],[200,"« Grâce à mes trois cristaux, je te tiens enfin, Kraal ! »"],[300,"« Tu ne gagneras pas ! Le Cristal-Roi sera bientôt à moi ! »"]]},
  { id:'s2', chap:"Chapitre 2 · Atterrissage forcé", dur:428, subs:[[8,"Les deux vaisseaux s'écrasèrent sur une planète déserte."],[90,"Nova et Kraal sortirent, face à face pour la première fois vraiment."],[200,"« C'est ici que tout se termine, Kraal », dit Nova, calme."],[300,"« Ou que tout commence pour moi ! », rugit le pirate."]]},
  { id:'s3', chap:"Chapitre 3 · Le combat final", dur:430, subs:[[8,"Kraal attaqua avec ses armes de pirate, féroce et puissant."],[90,"Nova esquiva, rapide et agile, sans jamais reculer."],[200,"« Tu te bats bien, exploratrice... mais pas assez ! »"],[300,"« Je me bats pour toutes les planètes que tu as pillées, Kraal ! »"]]},
  { id:'s4', chap:"Chapitre 4 · La ruse de Nova", dur:430, subs:[[8,"« BIP, maintenant ! Le plan qu'on a préparé ! », cria Nova."],[90,"BIP fonça et récupéra le sac de cristaux volés de Kraal !"],[200,"« NON ! Mes cristaux ! Sans eux, plus de Cristal-Roi ! »"],[300,"« C'est fini, Kraal. Ton plan tombe à l'eau ! »"]]},
  { id:'s5', chap:"Chapitre 5 · La capture", dur:430, subs:[[8,"Privé de ses cristaux, Kraal était enfin vulnérable."],[90,"Nova l'immobilisa avec un filet d'énergie du Comète."],[200,"« Le grand Capitaine Kraal... vaincu par une exploratrice. »"],[300,"« Tu n'es pas juste une exploratrice... tu es une héroïne. »"],[410,"Le terrible pirate de l'espace était enfin capturé ! 🎉"]]},
  { id:'s6', chap:"Chapitre 6 · Les planètes libérées", dur:428, subs:[[8,"Nova rendit tous les cristaux volés à leurs planètes."],[90,"Rubis, Glacia, Verda... toutes retrouvèrent leur énergie et leur vie."],[200,"Partout dans la galaxie, on célébrait le nom de Nova."],[300,"« Tu as sauvé des dizaines de mondes, Nova ! », bipa fièrement BIP."],[410,"« On l'a fait ENSEMBLE, BIP. Toute l'équipe du Comète ! »"]]},
  { id:'s7', chap:"Chapitre 7 · Vers de nouvelles aventures", dur:429, subs:[[8,"Avec Kraal derrière les barreaux, la paix revint dans la galaxie."],[90,"Mais l'univers est vaste, et plein de mystères à explorer."],[200,"« Alors, BIP, quelle est notre prochaine destination ? »"],[300,"« Inconnue, Nova ! Et c'est ça qui est passionnant ! »"],[410,"Et le Comète fila vers de nouvelles aventures parmi les étoiles... 🚀✨"]]}
];
const MACHINE_PCT = 100;
let si=0,t=0,subIdx=0,paused=false,timer=null;
let totalDur=SCENES.reduce((a,s)=>a+s.dur,0),elapsedBefore=0;
const $=id=>document.getElementById(id);
function demarrer(){
  $('intro').style.display='none';$('film').style.display='block';
  si=0;t=0;subIdx=0;elapsedBefore=0;showScene();
  setTimeout(()=>{$('mfill').style.width=MACHINE_PCT+'%';},400);
  timer=setInterval(tic,100);
}
function showScene(){
  document.querySelectorAll('.scene').forEach(e=>e.classList.remove('on'));
  const sc=SCENES[si];$(sc.id).classList.add('on');$('chap').textContent=sc.chap;$('sub').textContent='';subIdx=0;
}
function tic(){
  if(paused)return;t++;const sc=SCENES[si];
  while(subIdx<sc.subs.length&&t>=sc.subs[subIdx][0]){$('sub').textContent=sc.subs[subIdx][1];subIdx++;}
  const done=elapsedBefore+t;$('bar').style.width=Math.min(100,(done/totalDur)*100)+'%';
  if(t>=sc.dur){elapsedBefore+=sc.dur;si++;t=0;if(si>=SCENES.length){finir();return;}showScene();}
}
function togglePause(){paused=!paused;$('pauseBtn').textContent=paused?'▶ Lecture':'⏸ Pause';}
function finir(){
  clearInterval(timer);$('film').style.display='none';
  $('endtext').innerHTML='Nova a capturé Kraal et libéré toutes les planètes ! 🎉<br>Grâce à son courage et à BIP, la galaxie est sauvée.<br><b>Nova reviendra pour de nouvelles aventures !</b> 🚀✨';
  $('end').classList.add('on');
}
</script>
