  #intro .kick{letter-spacing:6px;color:#b98aff;font-weight:bold;font-size:clamp(11px,3vw,15px);}
  #intro .final{letter-spacing:4px;color:#ff5a5a;font-weight:900;font-size:clamp(13px,3.4vw,17px);margin-top:8px;}
  #intro h1{font-size:clamp(28px,8vw,54px);font-weight:900;line-height:1;margin:10px 0;
    background:linear-gradient(180deg,#fff,#d8caff,#8a6aff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #intro .ep{font-size:clamp(15px,4.4vw,22px);color:#eee;margin-top:6px;letter-spacing:2px;}

  .playbtn{margin-top:28px;padding:14px 40px;border:none;border-radius:40px;cursor:pointer;
    background:linear-gradient(135deg,#6a3ad6,#8a6aff);color:#fff;font-weight:900;font-size:clamp(15px,4vw,19px);
    letter-spacing:2px;box-shadow:0 10px 30px rgba(120,60,220,.5);}
  .playbtn:active{transform:scale(.96);}
  #film{position:relative;width:min(100vw,860px);aspect-ratio:16/10;max-height:100vh;
    border-radius:14px;overflow:hidden;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.7);}
  svg.scene{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .8s;}
  svg.scene.on{opacity:1;}
  #sub{position:absolute;left:0;right:0;bottom:5%;text-align:center;z-index:20;padding:0 8%;
    font-size:clamp(15px,3.6vw,24px);font-weight:bold;color:#fff;text-shadow:0 2px 10px #000,0 0 18px rgba(0,0,0,.9);
    min-height:2em;transition:opacity .3s;}
  #barwrap{position:absolute;left:0;right:0;top:0;height:5px;background:rgba(255,255,255,.12);z-index:25;}
  #bar{height:100%;width:0;background:linear-gradient(90deg,#6a3ad6,#b98aff);transition:width .2s linear;}
  #chap{position:absolute;top:12px;left:14px;z-index:25;font-size:clamp(11px,2.6vw,14px);

  /* jauge machine de Blaze */

  #mgauge{width:60px;height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;}
  #mfill{height:100%;width:0;background:linear-gradient(90deg,#ff6a2d,#ffd36b);transition:width 1s;}

  @keyframes tw{0%,100%{opacity:.25;}50%{opacity:.95;}}
  .float{transform-box:fill-box;transform-origin:center;animation:fl 3.4s ease-in-out infinite;}
  @keyframes fl{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
  .float.d1{animation-delay:.4s;}.float.d2{animation-delay:.9s;}.float.d3{animation-delay:1.4s;}
  .flame{transform-box:fill-box;transform-origin:bottom;animation:flk .5s ease-in-out infinite;}

  .wave{animation:wv 4s ease-in-out infinite;}
  @keyframes wv{0%,100%{transform:translateX(0);}50%{transform:translateX(-14px);}}
  .nyxeye{transform-box:fill-box;transform-origin:center;animation:eye 2s ease-in-out infinite;}
  @keyframes eye{0%,100%{opacity:.55;}50%{opacity:1;}}
  .spin{transform-box:fill-box;transform-origin:center;animation:sp 8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .fastspin{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite;}
  .glowpulse{animation:gp 2.4s ease-in-out infinite;}
  @keyframes gp{0%,100%{opacity:.4;}50%{opacity:.9;}}
  .shake{transform-box:fill-box;transform-origin:center;animation:shk .3s ease-in-out infinite;}
  @keyframes shk{0%,100%{transform:translate(0,0);}25%{transform:translate(-4px,2px);}75%{transform:translate(4px,-2px);}}
  .bigshake{transform-box:fill-box;transform-origin:center;animation:bshk .2s ease-in-out infinite;}
  @keyframes bshk{0%,100%{transform:translate(0,0);}25%{transform:translate(-7px,4px);}75%{transform:translate(7px,-4px);}}
  .stomp{transform-box:fill-box;transform-origin:bottom center;animation:stmp 1.4s ease-in-out infinite;}
  @keyframes stmp{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-8px) scale(1.02);}}
  .boom{transform-box:fill-box;transform-origin:center;animation:boomp .8s ease-out infinite;}
  @keyframes boomp{0%{transform:scale(.6);opacity:0;}30%{opacity:1;}100%{transform:scale(1.7);opacity:0;}}
  .zap{stroke-dasharray:6 6;animation:zapmove .3s linear infinite;}
  @keyframes zapmove{to{stroke-dashoffset:-24;}}
  .crumble{transform-box:fill-box;transform-origin:center;animation:crmb 2s ease-in forwards;}
  @keyframes crmb{0%{opacity:1;transform:scale(1) rotate(0);}100%{opacity:0;transform:scale(.4) rotate(30deg);}}
  .fadein{animation:fadein 3s ease-in forwards;}
  @keyframes fadein{from{opacity:0;}to{opacity:1;}}
  .frost{animation:frostpulse 2.5s ease-in-out infinite;}
  @keyframes frostpulse{0%,100%{opacity:.4;}50%{opacity:.9;}}
  .snow{animation:snowfall linear infinite;}
  @keyframes snowfall{from{transform:translateY(-20px);}to{transform:translateY(560px);}}
  .buildpulse{transform-box:fill-box;transform-origin:center;animation:bp 1.5s ease-in-out infinite;}

<script>
const SCENES = [
  { id:'s1', chap:"Chapitre 1 · La prison spatiale", dur:590, subs:[[8,"Depuis des mois, le Capitaine Kraal croupissait en prison spatiale."],[110,"Enfermé derrière les barreaux d'énergie les plus solides de la galaxie."],[230,"« Nova croit m'avoir arrêté pour toujours... quelle erreur. »"],[350,"« J'ai un plan. Et cette fois, RIEN ne pourra m'arrêter. »"],[470,"Dans l'ombre de sa cellule, Kraal souriait cruellement."]]},
  { id:'s2', chap:"Chapitre 2 · Le plan d'évasion", dur:600, subs:[[8,"Kraal avait caché un mini-cristal dans sa botte lors de sa capture."],[110,"Patiemment, il l'avait rechargé jour après jour."],[230,"« Assez de puissance pour faire sauter ces barreaux ! »"],[350,"D'un geste, il libéra une décharge d'énergie sur sa cellule."],[470,"BOUM ! Les barreaux d'énergie explosèrent ! 💥"]]},
  { id:'s3', chap:"Chapitre 3 · La fuite", dur:600, subs:[[8,"Les alarmes hurlèrent dans toute la prison spatiale."],[110,"« ÉVASION ! Le prisonnier Kraal s'échappe ! »"],[230,"Mais le pirate était déjà loin, filant vers les hangars."],[350,"Il vola un vaisseau de garde et disparut dans l'espace."],[470,"« Libre ! Enfin libre ! La galaxie va trembler ! »"]]},
  { id:'s4', chap:"Chapitre 4 · Nova apprend la nouvelle", dur:610, subs:[[8,"À l'autre bout de la galaxie, un message urgent atteignit le Comète."],[110,"« Nova ! Alerte maximale ! Kraal s'est évadé ! », bipa BIP, paniqué."],[230,"Le visage de Nova se figea. « Kraal... libre ? Ce n'est pas possible. »"],[350,"« S'il est dehors, il n'a qu'une idée en tête : le Cristal-Roi. »"],[470,"« On doit l'arrêter avant qu'il ne le crée. En route, BIP ! »"]]},
  { id:'s5', chap:"Chapitre 5 · La menace du Cristal-Roi", dur:600, subs:[[8,"BIP afficha un hologramme du terrible Cristal-Roi."],[110,"« S'il réunit tous les cristaux, il obtiendra un pouvoir infini. »"],[230,"« Assez pour contrôler chaque planète de la galaxie. »"],[350,"« Alors on ne le laissera pas faire. Jamais. », dit Nova, résolue."],[470,"La course la plus importante de sa vie commençait."]]},
  { id:'s6', chap:"Chapitre 6 · La traque reprend", dur:600, subs:[[8,"Le Comète fila à toute vitesse à travers les étoiles."],[110,"« Où irait Kraal en premier, BIP ? », demanda Nova."],[230,"« Vers la planète volcanique Ignis. Elle regorge de cristaux de feu. »"],[350,"« Alors c'est là qu'on l'attend. Cap sur Ignis ! »"],[470,"La saison finale de la traque venait de commencer. 🚀🔥"]]}
];
const MACHINE_PCT = 10;
let si=0,t=0,subIdx=0,paused=false,timer=null;
let totalDur=SCENES.reduce((a,s)=>a+s.dur,0),elapsedBefore=0;
const $=id=>document.getElementById(id);
function demarrer(){
  $('intro').style.display='none';$('film').style.display='block';
  si=0;t=0;subIdx=0;elapsedBefore=0;showScene();
  setTimeout(()=>{$('mfill').style.width=MACHINE_PCT+'%';},400);
  timer=setInterval(tic,100);
}
function showScene(){
  document.querySelectorAll('.scene').forEach(e=>e.classList.remove('on'));
  const sc=SCENES[si];$(sc.id).classList.add('on');$('chap').textContent=sc.chap;$('sub').textContent='';subIdx=0;
}
function tic(){
  if(paused)return;t++;const sc=SCENES[si];
  while(subIdx<sc.subs.length&&t>=sc.subs[subIdx][0]){$('sub').textContent=sc.subs[subIdx][1];subIdx++;}
  const done=elapsedBefore+t;$('bar').style.width=Math.min(100,(done/totalDur)*100)+'%';
  if(t>=sc.dur){elapsedBefore+=sc.dur;si++;t=0;if(si>=SCENES.length){finir();return;}showScene();}
}
function togglePause(){paused=!paused;$('pauseBtn').textContent=paused?'▶ Lecture':'⏸ Pause';}
function finir(){
  clearInterval(timer);$('film').style.display='none';
  $('endtext').innerHTML="Kraal s'est évadé et veut créer le Cristal-Roi !<br>Nova reprend la traque pour sauver la galaxie...<br>Rendez-vous à l'épisode 2 ! 🚀💎";
  $('end').classList.add('on');
}
</script>
