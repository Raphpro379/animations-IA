<script>
const SCENES = [
  { id:'s1', chap:"Chapitre 1 · Le tir du destin", dur:445, subs:[[8,"Le rayon de BIP fusa droit vers le cœur du Cristal-Roi !"],[100,"Cette fois, Kraal ne put le bloquer à temps."],[210,"Le rayon frappa le centre exact du cristal. 💥"],[320,"« NON ! IMPOSSIBLE ! », hurla Kraal."]]},
  { id:'s2', chap:"Chapitre 2 · La fissure", dur:448, subs:[[8,"Une fissure lumineuse apparut au cœur du Cristal-Roi."],[100,"« Le point faible ! Ça marche ! », s'écria Nova."],[210,"« Mon cristal... il se brise ! Ce n'est pas possible ! »"],[320,"La fissure s'étendait de plus en plus vite."]]},
  { id:'s3', chap:"Chapitre 3 · La colère de Kraal", dur:450, subs:[[8,"« Vous allez le payer ! », rugit Kraal, désespéré."],[100,"Il tenta d'utiliser les dernières forces du cristal fissuré."],[210,"« Le Cristal-Roi est instable maintenant, Kraal ! Lâche-le ! »"],[320,"Mais le pirate, aveuglé par le pouvoir, refusa d'écouter."]]},
  { id:'s4', chap:"Chapitre 4 · La dernière poussée", dur:450, subs:[[8,"« BIP, encore un tir ! On finit le travail ! »"],[100,"« Dernière charge d'énergie... prête ! »"],[210,"Ensemble, Nova et BIP lancèrent un ultime rayon."],[320,"« POUR LA GALAXIE ! »"]]},
  { id:'s5', chap:"Chapitre 5 · La destruction du cristal", dur:450, subs:[[8,"Le second rayon frappa la fissure de plein fouet."],[100,"Dans une explosion de lumière, le Cristal-Roi vola en éclats ! 💥"],[210,"L'énergie volée retourna vers toutes les planètes de la galaxie."],[320,"Le pouvoir ultime de Kraal était anéanti à jamais."]]},
  { id:'s6', chap:"Chapitre 6 · La capture de Kraal", dur:450, subs:[[8,"Privé du cristal, Kraal s'effondra, vaincu pour de bon."],[100,"« C'est fini, Kraal. Cette fois, pour toujours. »"],[210,"Nova l'emprisonna dans un filet d'énergie inbrisable."],[320,"« Comment... une simple exploratrice... a pu me battre... »"],[400,"« Parce que je n'étais jamais seule, Kraal. »"]]},
  { id:'s7', chap:"Chapitre 7 · Astra sauvée", dur:448, subs:[[8,"Nova courut vers Astra, qui se releva doucement."],[100,"« Tu as réussi, Nova... tu as sauvé la galaxie ! »"],[210,"« On a réussi. Toi, moi, BIP. Toute l'équipe. »"],[320,"« La meilleure équipe de toute la galaxie ! », bipa BIP, joyeux."],[400,"Les trois amis se serrèrent dans une accolade émue."]]},
  { id:'s8', chap:"Chapitre 8 · La galaxie en paix", dur:459, subs:[[8,"Avec Kraal capturé et le Cristal-Roi détruit, la paix revint enfin."],[100,"Toutes les planètes retrouvèrent leur énergie et célébrèrent Nova."],[210,"« La galaxie est en sécurité. Notre mission est accomplie. »"],[320,"« Mais l'univers est vaste... il y aura toujours à explorer ! »"],[400,"Et Nova, Astra et BIP filèrent vers de nouvelles étoiles, ensemble. 🚀✨"]]}
];
const MACHINE_PCT = 100;
let si=0,t=0,subIdx=0,paused=false,timer=null;
let totalDur=SCENES.reduce((a,s)=>a+s.dur,0),elapsedBefore=0;
const $=id=>document.getElementById(id);
function demarrer(){
  $('intro').style.display='none';$('film').style.display='block';
  si=0;t=0;subIdx=0;elapsedBefore=0;showScene();
  setTimeout(()=>{$('mfill').style.width=MACHINE_PCT+'%';},400);
  timer=setInterval(tic,100);
}
function showScene(){
  document.querySelectorAll('.scene').forEach(e=>e.classList.remove('on'));
  const sc=SCENES[si];$(sc.id).classList.add('on');$('chap').textContent=sc.chap;$('sub').textContent='';subIdx=0;
}
function tic(){
  if(paused)return;t++;const sc=SCENES[si];
  while(subIdx<sc.subs.length&&t>=sc.subs[subIdx][0]){$('sub').textContent=sc.subs[subIdx][1];subIdx++;}
  const done=elapsedBefore+t;$('bar').style.width=Math.min(100,(done/totalDur)*100)+'%';
  if(t>=sc.dur){elapsedBefore+=sc.dur;si++;t=0;if(si>=SCENES.length){finir();return;}showScene();}
}
function togglePause(){paused=!paused;$('pauseBtn').textContent=paused?'▶ Lecture':'⏸ Pause';}
function finir(){
  clearInterval(timer);$('film').style.display='none';
  $('endtext').innerHTML="Nova a détruit le Cristal-Roi et capturé Kraal pour toujours ! 🎉<br>Grâce à Astra, BIP et son courage, la galaxie est sauvée.<br><b>★ FIN DE LA SÉRIE ★</b><br>Merci d'avoir suivi Nova, Chasseuse des étoiles ! 🚀✨";
  $('end').classList.add('on');
}
</script>
