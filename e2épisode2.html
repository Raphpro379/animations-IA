<script>
const SCENES = [
  { id:'s1', chap:"Chapitre 1 · La planète Ignis", dur:590, subs:[[8,"Le Comète arriva au-dessus d'Ignis, la planète volcanique."],[110,"Des rivières de lave brillaient à sa surface brûlante."],[230,"« Les cristaux de feu sont là-dedans, BIP. Kraal aussi, sûrement. »"],[350,"« Prudence, Nova. Cet endroit est aussi dangereux que beau. »"],[470,"Nova posa le Comète près d'un volcan endormi."]]},
  { id:'s2', chap:"Chapitre 2 · Sur les traces de Kraal", dur:600, subs:[[8,"Nova avança sur le sol brûlant, esquivant les jets de lave."],[110,"Des traces de pas récentes marquaient la cendre."],[230,"« Kraal est déjà passé par ici. On le suit ! »"],[350,"Au loin, une explosion secoua un volcan : Kraal creusait pour les cristaux."],[470,"« Il ne perd pas de temps. Dépêchons-nous ! »"]]},
  { id:'s3', chap:"Chapitre 3 · Le pirate au travail", dur:600, subs:[[8,"Kraal arrachait les cristaux de feu à la roche en fusion."],[110,"« Un... deux... trois cristaux de feu ! Excellent ! »"],[230,"« Bientôt, le Cristal-Roi sera à moi, et la galaxie avec ! »"],[350,"« Pas si vite, Kraal ! », cria une voix derrière lui."],[470,"Nova se tenait là, prête au combat. « Rends ces cristaux ! »"]]},
  { id:'s4', chap:"Chapitre 4 · Duel sur la lave", dur:610, subs:[[8,"Nova et Kraal s'affrontèrent au bord d'un lac de lave."],[110,"« Tu es plus tenace qu'avant, exploratrice ! », grogna Kraal."],[230,"« Et toi toujours aussi cruel ! Ça s'arrête maintenant ! »"],[350,"Ils échangèrent des coups au-dessus du vide brûlant."],[470,"Mais Kraal avait un tour dans son sac..."]]},
  { id:'s5', chap:"Chapitre 5 · Kraal s'échappe encore", dur:600, subs:[[8,"Kraal fit exploser le volcan pour couvrir sa fuite ! 💥"],[110,"Nova dut reculer face au torrent de lave et de fumée."],[230,"« À la prochaine, Nova ! J'ai mes cristaux de feu ! »"],[350,"Le pirate décolla, laissant Nova sur la planète tremblante."],[470,"« Il a gagné cette manche... mais la guerre n'est pas finie. »"]]},
  { id:'s6', chap:"Chapitre 6 · Le compte à rebours", dur:600, subs:[[8,"De retour dans le Comète, BIP fit le point sur la menace."],[110,"« Kraal a maintenant les cristaux de feu. Il lui en manque peu. »"],[230,"« Chaque cristar le rapproche du Cristal-Roi. »"],[350,"« Alors on doit être plus malins et plus rapides que lui. »"],[470,"« Il nous faut de l'aide, Nova. On ne peut pas y arriver seuls. »"]]}
];
const MACHINE_PCT = 20;
let si=0,t=0,subIdx=0,paused=false,timer=null;
let totalDur=SCENES.reduce((a,s)=>a+s.dur,0),elapsedBefore=0;
const $=id=>document.getElementById(id);
function demarrer(){
  $('intro').style.display='none';$('film').style.display='block';
  si=0;t=0;subIdx=0;elapsedBefore=0;showScene();
  setTimeout(()=>{$('mfill').style.width=MACHINE_PCT+'%';},400);
  timer=setInterval(tic,100);
}
function showScene(){
  document.querySelectorAll('.scene').forEach(e=>e.classList.remove('on'));
  const sc=SCENES[si];$(sc.id).classList.add('on');$('chap').textContent=sc.chap;$('sub').textContent='';subIdx=0;
}
function tic(){
  if(paused)return;t++;const sc=SCENES[si];
  while(subIdx<sc.subs.length&&t>=sc.subs[subIdx][0]){$('sub').textContent=sc.subs[subIdx][1];subIdx++;}
  const done=elapsedBefore+t;$('bar').style.width=Math.min(100,(done/totalDur)*100)+'%';
  if(t>=sc.dur){elapsedBefore+=sc.dur;si++;t=0;if(si>=SCENES.length){finir();return;}showScene();}
}
function togglePause(){paused=!paused;$('pauseBtn').textContent=paused?'▶ Lecture':'⏸ Pause';}
function finir(){
  clearInterval(timer);$('film').style.display='none';
  $('endtext').innerHTML="Kraal a volé les cristaux de feu sur Ignis !<br>Nova a besoin d'aide pour le rattraper...<br>Rendez-vous à l'épisode 3 ! 🚀🔥";
  $('end').classList.add('on');
}
</script>
