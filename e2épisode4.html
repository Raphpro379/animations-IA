<script>
const SCENES = [
  { id:'s1', chap:"Chapitre 1 · Dans les astéroïdes", dur:590, subs:[[8,"Le champ d'astéroïdes était un labyrinthe mortel de rochers géants."],[110,"« Attention Nova, ça bouge dans tous les sens ici ! »"],[230,"Nova esquivait les astéroïdes avec une précision incroyable."],[350,"« Kraal est droit devant. Ne le perdons pas ! »"],[470,"Astra suivait de près, aussi habile que Nova."]]},
  { id:'s2', chap:"Chapitre 2 · Le piège de rochers", dur:600, subs:[[8,"Kraal tira sur un gros astéroïde pour le faire exploser !"],[110,"Des débris rocheux fusèrent vers Nova et Astra."],[230,"« Il essaie de nous écraser ! Manœuvre, Astra ! »"],[350,"Les deux pilotes évitèrent les rochers de justesse."],[470,"« Ce pirate est vraiment prêt à tout ! »"]]},
  { id:'s3', chap:"Chapitre 3 · Astra en danger", dur:600, subs:[[8,"Le vaisseau d'Astra fut coincé entre deux astéroïdes ! 😱"],[110,"« Nova, je suis bloquée ! Je ne peux plus bouger ! »"],[230,"« Tiens bon, Astra ! J'arrive ! »"],[350,"Nova fit demi-tour, abandonnant la poursuite pour sauver son amie."],[470,"« Un allié, ça ne s'abandonne jamais. »"]]},
  { id:'s4', chap:"Chapitre 4 · Le sauvetage", dur:610, subs:[[8,"Nova utilisa le rayon tracteur du Comète pour libérer Astra."],[110,"« Accroche-toi ! Je te tire de là ! »"],[230,"Dans un effort, le Comète dégagea le vaisseau coincé."],[350,"« Merci, Nova... tu m'as sauvé la vie. »"],[470,"« C'est à ça que servent les amis, Astra. »"]]},
  { id:'s5', chap:"Chapitre 5 · Kraal a disparu", dur:600, subs:[[8,"Mais pendant le sauvetage, Kraal avait disparu dans les astéroïdes."],[110,"« On l'a perdu... », soupira Astra, déçue."],[230,"« Ce n'est pas grave. Je préfère te sauver que l'attraper. »"],[350,"« Tu es une vraie amie, Nova. On l'aura, promis. »"],[470,"Leur amitié était plus forte que jamais."]]},
  { id:'s6', chap:"Chapitre 6 · La prochaine cible", dur:600, subs:[[8,"BIP capta un signal : Kraal filait vers la planète de glace."],[110,"« Il va chercher les cristaux de glace sur Glacia ! »"],[230,"« On connaît cette planète. On y a déjà affronté Kraal ! »"],[350,"« Alors on sait comment s'y battre. En route ! »"],[470,"L'équipe reprit la poursuite, plus soudée que jamais. ❄️"]]}
];
const MACHINE_PCT = 40;
let si=0,t=0,subIdx=0,paused=false,timer=null;
let totalDur=SCENES.reduce((a,s)=>a+s.dur,0),elapsedBefore=0;
const $=id=>document.getElementById(id);
function demarrer(){
  $('intro').style.display='none';$('film').style.display='block';
  si=0;t=0;subIdx=0;elapsedBefore=0;showScene();
  setTimeout(()=>{$('mfill').style.width=MACHINE_PCT+'%';},400);
  timer=setInterval(tic,100);
}
function showScene(){
  document.querySelectorAll('.scene').forEach(e=>e.classList.remove('on'));
  const sc=SCENES[si];$(sc.id).classList.add('on');$('chap').textContent=sc.chap;$('sub').textContent='';subIdx=0;
}
function tic(){
  if(paused)return;t++;const sc=SCENES[si];
  while(subIdx<sc.subs.length&&t>=sc.subs[subIdx][0]){$('sub').textContent=sc.subs[subIdx][1];subIdx++;}
  const done=elapsedBefore+t;$('bar').style.width=Math.min(100,(done/totalDur)*100)+'%';
  if(t>=sc.dur){elapsedBefore+=sc.dur;si++;t=0;if(si>=SCENES.length){finir();return;}showScene();}
}
function togglePause(){paused=!paused;$('pauseBtn').textContent=paused?'▶ Lecture':'⏸ Pause';}
function finir(){
  clearInterval(timer);$('film').style.display='none';
  $('endtext').innerHTML="Nova a sauvé Astra, mais Kraal s'est échappé !<br>La traque continue vers la planète de glace...<br>Rendez-vous à l'épisode 5 ! 🚀☄️";
  $('end').classList.add('on');
}
</script>
