</div>
<script>
const SCENES = [
  { id:'s1', chap:"Chapitre 1 · Retour sur Glacia", dur:590, subs:[[8,"L'équipe revint sur Glacia, la planète de glace scintillante."],[110,"« Kraal cherche les cristaux de glace. On doit le devancer. »"],[230,"« Je prends le nord, tu prends le sud ? », proposa Astra."],[350,"« Bonne idée. BIP, tu m'accompagnes. »"],[470,"Ils se séparèrent pour couvrir plus de terrain."]]},
  { id:'s2', chap:"Chapitre 2 · Le piège de Kraal", dur:600, subs:[[8,"Mais Kraal les attendait, caché dans une grotte de glace."],[110,"« Cette fois, je vais frapper là où ça fait mal... »"],[230,"Il visa non pas Nova, mais son fidèle robot BIP !"],[350,"Un filet d'énergie jaillit et captura le petit robot ! 😱"],[470,"« BIP ! NON ! », hurla Nova."]]},
  { id:'s3', chap:"Chapitre 3 · BIP prisonnier", dur:600, subs:[[8,"« Si tu veux revoir ton petit robot, laisse-moi les cristaux ! »"],[110,"Kraal tenait BIP prisonnier dans une bulle d'énergie."],[230,"« Ne l'écoute pas, Nova ! Sauve la galaxie ! », bipa BIP."],[350,"Nova était déchirée : son ami ou sa mission ?"],[470,"« Je ne te laisserai pas, BIP. Jamais. »"]]},
  { id:'s4', chap:"Chapitre 4 · Astra à la rescousse", dur:610, subs:[[8,"Soudain, le vaisseau d'Astra surgit et fonça sur Kraal !"],[110,"« Lâche ce robot, pirate ! », cria Astra."],[230,"Surpris, Kraal relâcha son attention une seconde."],[350,"« Maintenant, Nova ! », lança Astra."],[470,"C'était l'ouverture que Nova attendait."]]},
  { id:'s5', chap:"Chapitre 5 · Le sauvetage de BIP", dur:600, subs:[[8,"Nova bondit et libéra BIP de la bulle d'énergie !"],[110,"« Je te tiens, mon ami ! Tu es en sécurité ! »"],[230,"« Je savais que tu viendrais, Nova ! », bipa BIP, ému."],[350,"Mais dans la confusion, Kraal en profita pour voler les cristaux de glace."],[470,"« Merci pour la diversion ! À la prochaine ! »"]]},
  { id:'s6', chap:"Chapitre 6 · L'amitié plus forte", dur:600, subs:[[8,"Kraal s'était échappé avec les cristaux de glace, encore une fois."],[110,"« On l'a laissé filer pour sauver BIP », dit Astra."],[230,"« Et je recommencerais sans hésiter », répondit Nova."],[350,"« Notre équipe, c'est notre vraie force. Pas les cristaux. »"],[470,"« Ensemble, on arrêtera Kraal. J'en suis sûre. »"]]}
];
const MACHINE_PCT = 50;
let si=0,t=0,subIdx=0,paused=false,timer=null;
let totalDur=SCENES.reduce((a,s)=>a+s.dur,0),elapsedBefore=0;
const $=id=>document.getElementById(id);
function demarrer(){
  $('intro').style.display='none';$('film').style.display='block';
  si=0;t=0;subIdx=0;elapsedBefore=0;showScene();
  setTimeout(()=>{$('mfill').style.width=MACHINE_PCT+'%';},400);
  timer=setInterval(tic,100);
}
function showScene(){
  document.querySelectorAll('.scene').forEach(e=>e.classList.remove('on'));
  const sc=SCENES[si];$(sc.id).classList.add('on');$('chap').textContent=sc.chap;$('sub').textContent='';subIdx=0;
}
function tic(){
  if(paused)return;t++;const sc=SCENES[si];
  while(subIdx<sc.subs.length&&t>=sc.subs[subIdx][0]){$('sub').textContent=sc.subs[subIdx][1];subIdx++;}
  const done=elapsedBefore+t;$('bar').style.width=Math.min(100,(done/totalDur)*100)+'%';
  if(t>=sc.dur){elapsedBefore+=sc.dur;si++;t=0;if(si>=SCENES.length){finir();return;}showScene();}
}
function togglePause(){paused=!paused;$('pauseBtn').textContent=paused?'▶ Lecture':'⏸ Pause';}
function finir(){
  clearInterval(timer);$('film').style.display='none';
  $('endtext').innerHTML="Nova a sauvé BIP, mais Kraal a les cristaux de glace !<br>Il se rapproche dangereusement du Cristal-Roi...<br>Rendez-vous à l'épisode 6 ! 🚀🤖";
  $('end').classList.add('on');
}
</script>
