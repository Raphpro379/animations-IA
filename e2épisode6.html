<script>
const SCENES = [
  { id:'s1', chap:"Chapitre 1 · La bibliothèque des étoiles", dur:590, subs:[[8,"L'équipe se rendit à la Bibliothèque des Étoiles, ancienne et sage."],[110,"« Si le Cristal-Roi a un point faible, c'est ici qu'on le trouvera. »"],[230,"Des millions de connaissances y étaient conservées."],[350,"« BIP, cherche tout ce qui parle du Cristal-Roi. »"],[470,"Le petit robot fouilla les archives à toute vitesse."]]},
  { id:'s2', chap:"Chapitre 2 · La légende ancienne", dur:600, subs:[[8,"« Trouvé ! », bipa BIP. « Une légende sur le Cristal-Roi. »"],[110,"« Il est immensément puissant... mais instable en son cœur. »"],[230,"« Son cœur ? Ça veut dire qu'il a un point faible ! », dit Astra."],[350,"« Exactement. Un seul point : le centre du cristal. »"],[470,"« Si on frappe là, il se brisera entièrement. »"]]},
  { id:'s3', chap:"Chapitre 3 · Le plan se dessine", dur:600, subs:[[8,"« Alors voilà notre plan », dit Nova, déterminée."],[110,"« Si Kraal crée le Cristal-Roi, on visera son cœur. »"],[230,"« Mais il faudra passer sa garde. Ce sera dangereux. »"],[350,"« On est trois. Et on a un plan. On peut y arriver ! »"],[470,"L'espoir renaissait dans l'équipe."]]},
  { id:'s4', chap:"Chapitre 4 · L'arme spéciale", dur:610, subs:[[8,"BIP eut une idée géniale pour frapper le cœur du cristal."],[110,"« Je peux concentrer l'énergie de nos cristaux en un rayon puissant ! »"],[230,"« Un rayon assez fort pour percer le Cristal-Roi ! »"],[350,"« BIP, tu es un génie ! », s'exclama Nova."],[470,"L'équipe avait enfin une arme contre la menace ultime."]]},
  { id:'s5', chap:"Chapitre 5 · Le signal d'alarme", dur:600, subs:[[8,"Soudain, une alarme retentit : un signal d'énergie colossal !"],[110,"« C'est Kraal ! Il a presque tous les cristaux ! », cria BIP."],[230,"« Il ne lui manque plus qu'un seul. On doit y aller MAINTENANT ! »"],[350,"« Où est-il, BIP ? », demanda Nova, tendue."],[470,"« Sur la planète de la foudre. Le dernier cristal y est ! »"]]},
  { id:'s6', chap:"Chapitre 6 · La course finale commence", dur:600, subs:[[8,"L'équipe fonça vers la planète de la foudre à pleine vitesse."],[110,"« Si on l'arrête là, il ne créera jamais le Cristal-Roi ! »"],[230,"« Et si on échoue... la galaxie est perdue. »"],[350,"« Alors on n'échouera pas. Tous ensemble ! »"],[470,"La dernière ligne droite de la traque commençait. ⚡"]]}
];
const MACHINE_PCT = 60;
let si=0,t=0,subIdx=0,paused=false,timer=null;
let totalDur=SCENES.reduce((a,s)=>a+s.dur,0),elapsedBefore=0;
const $=id=>document.getElementById(id);
function demarrer(){
  $('intro').style.display='none';$('film').style.display='block';
  si=0;t=0;subIdx=0;elapsedBefore=0;showScene();
  setTimeout(()=>{$('mfill').style.width=MACHINE_PCT+'%';},400);
  timer=setInterval(tic,100);
}
function showScene(){
  document.querySelectorAll('.scene').forEach(e=>e.classList.remove('on'));
  const sc=SCENES[si];$(sc.id).classList.add('on');$('chap').textContent=sc.chap;$('sub').textContent='';subIdx=0;
}
function tic(){
  if(paused)return;t++;const sc=SCENES[si];
  while(subIdx<sc.subs.length&&t>=sc.subs[subIdx][0]){$('sub').textContent=sc.subs[subIdx][1];subIdx++;}
  const done=elapsedBefore+t;$('bar').style.width=Math.min(100,(done/totalDur)*100)+'%';
  if(t>=sc.dur){elapsedBefore+=sc.dur;si++;t=0;if(si>=SCENES.length){finir();return;}showScene();}
}
function togglePause(){paused=!paused;$('pauseBtn').textContent=paused?'▶ Lecture':'⏸ Pause';}
function finir(){
  clearInterval(timer);$('film').style.display='none';
  $('endtext').innerHTML="Nova connaît le point faible du Cristal-Roi : son cœur !<br>Mais Kraal est sur le point de le créer...<br>Rendez-vous à l'épisode 7 ! 🚀🔍";
  $('end').classList.add('on');
}
</script>
