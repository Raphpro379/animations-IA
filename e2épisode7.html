<script>
const SCENES = [
  { id:'s1', chap:"Chapitre 1 · La planète de la foudre", dur:590, subs:[[8,"La planète Fulgor crépitait d'éclairs violets permanents."],[110,"« Le dernier cristal, celui de foudre, est ici. »"],[230,"« Kraal doit déjà le chercher. Prudence à tous ! »"],[350,"Les éclairs illuminaient le ciel d'orage."],[470,"L'équipe atterrit au cœur de la tempête électrique."]]},
  { id:'s2', chap:"Chapitre 2 · Trop tard ?", dur:600, subs:[[8,"Mais Kraal tenait déjà le cristal de foudre dans sa main !"],[110,"« Vous arrivez trop tard ! J'ai TOUS les cristaux ! »"],[230,"« Non... il ne manquait que celui-là ! », réalisa Nova."],[350,"« Maintenant, rien ne m'empêchera de créer le Cristal-Roi ! »"],[470,"Le pire scénario était en train de se produire."]]},
  { id:'s3', chap:"Chapitre 3 · Le piège se referme", dur:600, subs:[[8,"Kraal activa un piège d'énergie qui emprisonna Nova et Astra !"],[110,"« Restez donc là pour admirer ma victoire ! »"],[230,"« Il nous a piégés ! », cria Astra en frappant la barrière."],[350,"« BIP ! Tu es notre seul espoir ! », lança Nova."],[470,"Le petit robot avait échappé au piège de justesse."]]},
  { id:'s4', chap:"Chapitre 4 · BIP entre en action", dur:610, subs:[[8,"« Le sort de la galaxie repose sur moi... pas de pression ! », bipa BIP."],[110,"Le petit robot se faufila vers le générateur du piège."],[230,"« Courage BIP, tu peux le faire ! », l'encouragea Nova."],[350,"BIP trancha les câbles d'énergie avec son laser."],[470,"La barrière du piège s'effondra ! « Libres ! »"]]},
  { id:'s5', chap:"Chapitre 5 · Kraal prend l'avance", dur:600, subs:[[8,"Mais Kraal avait profité du piège pour prendre de l'avance."],[110,"« Il file vers son repaire pour créer le Cristal-Roi ! »"],[230,"« On a été trop lents... », soupira Astra."],[350,"« Non. On sait où il va, et on sait son point faible. »"],[470,"« La partie n'est pas finie. Poursuivons-le ! »"]]},
  { id:'s6', chap:"Chapitre 6 · La dernière chance", dur:600, subs:[[8,"À bord du Comète, l'équipe fonçait vers le repaire de Kraal."],[110,"« Quand il créera le Cristal-Roi, il sera vulnérable un instant. »"],[230,"« C'est à ce moment qu'on frappera son cœur avec le rayon de BIP. »"],[350,"« Une seule chance. On ne peut pas la rater. »"],[470,"Le combat final approchait à grands pas. 💎👑"]]}
];
const MACHINE_PCT = 75;
let si=0,t=0,subIdx=0,paused=false,timer=null;
let totalDur=SCENES.reduce((a,s)=>a+s.dur,0),elapsedBefore=0;
const $=id=>document.getElementById(id);
function demarrer(){
  $('intro').style.display='none';$('film').style.display='block';
  si=0;t=0;subIdx=0;elapsedBefore=0;showScene();
  setTimeout(()=>{$('mfill').style.width=MACHINE_PCT+'%';},400);
  timer=setInterval(tic,100);
}
function showScene(){
  document.querySelectorAll('.scene').forEach(e=>e.classList.remove('on'));
  const sc=SCENES[si];$(sc.id).classList.add('on');$('chap').textContent=sc.chap;$('sub').textContent='';subIdx=0;
}
function tic(){
  if(paused)return;t++;const sc=SCENES[si];
  while(subIdx<sc.subs.length&&t>=sc.subs[subIdx][0]){$('sub').textContent=sc.subs[subIdx][1];subIdx++;}
  const done=elapsedBefore+t;$('bar').style.width=Math.min(100,(done/totalDur)*100)+'%';
  if(t>=sc.dur){elapsedBefore+=sc.dur;si++;t=0;if(si>=SCENES.length){finir();return;}showScene();}
}
function togglePause(){paused=!paused;$('pauseBtn').textContent=paused?'▶ Lecture':'⏸ Pause';}
function finir(){
  clearInterval(timer);$('film').style.display='none';
  $('endtext').innerHTML="Kraal a tous les cristaux et file créer le Cristal-Roi !<br>Nova a une seule chance de l'arrêter...<br>Rendez-vous à l'épisode 8 ! 🚀⚡";
  $('end').classList.add('on');
}
</script>
