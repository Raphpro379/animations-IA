<script>
const SCENES = [
  { id:'s1', chap:"Chapitre 1 · Le repaire final", dur:590, subs:[[8,"L'équipe atteignit le repaire sombre de Kraal, sur un astéroïde géant."],[110,"« C'est ici que tout va se jouer », murmura Nova."],[230,"« Restez prêts. Dès que le Cristal-Roi apparaît, on agit. »"],[350,"« BIP, ton rayon est chargé ? », demanda Astra."],[470,"« Affirmatif ! Prêt à sauver la galaxie ! »"]]},
  { id:'s2', chap:"Chapitre 2 · La création commence", dur:600, subs:[[8,"Au centre du repaire, Kraal rassembla tous les cristaux volés."],[110,"« Feu, glace, foudre... tous réunis enfin ! »"],[230,"« CRISTAL-ROI, PRENDS VIE ! »"],[350,"Les cristaux fusionnèrent dans une lumière aveuglante."],[470,"Le terrible Cristal-Roi commença à se former. 💎"]]},
  { id:'s3', chap:"Chapitre 3 · Le pouvoir ultime", dur:600, subs:[[8,"Le Cristal-Roi jaillit, immense et éclatant de puissance !"],[110,"Kraal s'en empara, et une énergie folle l'enveloppa."],[230,"« OUI ! Je le sens ! Le pouvoir de toute la galaxie ! »"],[350,"« Plus personne ne pourra m'arrêter, désormais ! »"],[470,"Kraal était devenu terriblement puissant. 😱"]]},
  { id:'s4', chap:"Chapitre 4 · L'attaque de l'équipe", dur:610, subs:[[8,"« Maintenant ou jamais ! Visez le cœur du Cristal-Roi ! »"],[110,"BIP chargea son rayon d'énergie concentrée."],[230,"« Nova, Astra, protégez-moi pendant que je vise ! »"],[350,"Le petit robot ajusta son tir vers le centre du cristal."],[470,"« Pour la galaxie... FEU ! »"]]},
  { id:'s5', chap:"Chapitre 5 · Kraal contre-attaque", dur:600, subs:[[8,"Mais Kraal para le rayon avec le pouvoir du Cristal-Roi !"],[110,"« Vous croyez pouvoir me vaincre ? RIDICULE ! »"],[230,"Une onde d'énergie repoussa toute l'équipe violemment."],[350,"« Le Cristal-Roi me rend invincible ! »"],[470,"L'équipe fut projetée au sol, sonnée."]]},
  { id:'s6', chap:"Chapitre 6 · Ne jamais abandonner", dur:600, subs:[[8,"Nova se releva, meurtrie mais déterminée."],[110,"« Il est puissant... mais le Cristal-Roi a un point faible. »"],[230,"« On a raté le cœur. Il faut réessayer, coûte que coûte. »"],[350,"« Kraal ne gagnera pas. Pas tant qu'on respire encore. »"],[470,"La bataille la plus dure de leur vie ne faisait que commencer."]]}
];
const MACHINE_PCT = 90;
let si=0,t=0,subIdx=0,paused=false,timer=null;
let totalDur=SCENES.reduce((a,s)=>a+s.dur,0),elapsedBefore=0;
const $=id=>document.getElementById(id);
function demarrer(){
  $('intro').style.display='none';$('film').style.display='block';
  si=0;t=0;subIdx=0;elapsedBefore=0;showScene();
  setTimeout(()=>{$('mfill').style.width=MACHINE_PCT+'%';},400);
  timer=setInterval(tic,100);
}
function showScene(){
  document.querySelectorAll('.scene').forEach(e=>e.classList.remove('on'));
  const sc=SCENES[si];$(sc.id).classList.add('on');$('chap').textContent=sc.chap;$('sub').textContent='';subIdx=0;
}
function tic(){
  if(paused)return;t++;const sc=SCENES[si];
  while(subIdx<sc.subs.length&&t>=sc.subs[subIdx][0]){$('sub').textContent=sc.subs[subIdx][1];subIdx++;}
  const done=elapsedBefore+t;$('bar').style.width=Math.min(100,(done/totalDur)*100)+'%';
  if(t>=sc.dur){elapsedBefore+=sc.dur;si++;t=0;if(si>=SCENES.length){finir();return;}showScene();}
}
function togglePause(){paused=!paused;$('pauseBtn').textContent=paused?'▶ Lecture':'⏸ Pause';}
function finir(){
  clearInterval(timer);$('film').style.display='none';
  $('endtext').innerHTML="Kraal a créé le Cristal-Roi et repoussé l'équipe !<br>Nova doit trouver un moyen de frapper son cœur...<br>Rendez-vous à l'épisode 9 ! 🚀👑";
  $('end').classList.add('on');
}
</script>
