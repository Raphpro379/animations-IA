<script>
const SCENES = [
  { id:'s1', chap:"Chapitre 1 · Kraal tout-puissant", dur:590, subs:[[8,"Avec le Cristal-Roi, Kraal était devenu presque invincible."],[110,"Il déchaînait des tempêtes d'énergie sur toute la région."],[230,"« Regardez ma puissance ! La galaxie entière m'appartient ! »"],[350,"Nova, Astra et BIP tenaient à peine debout face à lui."],[470,"La situation semblait désespérée."]]},
  { id:'s2', chap:"Chapitre 2 · Le sacrifice d'Astra", dur:600, subs:[[8,"Astra fonça sur Kraal avec son vaisseau pour le distraire."],[110,"« Nova, occupe-toi du cristal ! Je le retiens ! »"],[230,"« Astra, non, c'est trop dangereux ! », cria Nova."],[350,"Mais Kraal frappa le vaisseau d'Astra, qui s'écrasa."],[470,"« ASTRA ! », hurla Nova, le cœur brisé."]]},
  { id:'s3', chap:"Chapitre 3 · Le désespoir", dur:600, subs:[[8,"Astra était au sol, son vaisseau en fumée mais vivante."],[110,"« Nova... ne t'arrête pas... sauve la galaxie... », souffla-t-elle."],[230,"Nova serra les poings, dévastée mais plus déterminée que jamais."],[350,"« Tu ne t'es pas sacrifiée pour rien, Astra. Je te le jure. »"],[470,"Une force nouvelle grandissait en elle."]]},
  { id:'s4', chap:"Chapitre 4 · Le courage de Nova", dur:610, subs:[[8,"« BIP, il nous reste une chance. Notre rayon. »"],[110,"« Mais Kraal le bloquera encore, Nova... »"],[230,"« Pas si je m'approche assez pour viser son cœur de près. »"],[350,"« C'est trop risqué ! Il pourrait te détruire ! »"],[470,"« La galaxie vaut tous les risques. Prépare le rayon, BIP. »"]]},
  { id:'s5', chap:"Chapitre 5 · L'assaut final", dur:600, subs:[[8,"Nova s'élança droit vers Kraal, esquivant ses attaques."],[110,"« Tu es folle de m'affronter seule ! », rugit le pirate."],[230,"« Je ne suis pas seule ! J'ai mes amis dans mon cœur ! »"],[350,"Elle se rapprochait du Cristal-Roi, mètre par mètre."],[470,"« Encore un peu... presque à portée... »"]]},
  { id:'s6', chap:"Chapitre 6 · Le moment décisif", dur:600, subs:[[8,"Nova arriva enfin face au cœur du Cristal-Roi."],[110,"« BIP, MAINTENANT ! Vise le cœur ! »"],[230,"« Rayon chargé au maximum ! », répondit le robot."],[350,"Le destin de la galaxie tenait à un seul tir."],[470,"« Pour Astra, pour toutes les planètes... FEU ! »"]]}
];
const MACHINE_PCT = 95;
let si=0,t=0,subIdx=0,paused=false,timer=null;
let totalDur=SCENES.reduce((a,s)=>a+s.dur,0),elapsedBefore=0;
const $=id=>document.getElementById(id);
function demarrer(){
  $('intro').style.display='none';$('film').style.display='block';
  si=0;t=0;subIdx=0;elapsedBefore=0;showScene();
  setTimeout(()=>{$('mfill').style.width=MACHINE_PCT+'%';},400);
  timer=setInterval(tic,100);
}
function showScene(){
  document.querySelectorAll('.scene').forEach(e=>e.classList.remove('on'));
  const sc=SCENES[si];$(sc.id).classList.add('on');$('chap').textContent=sc.chap;$('sub').textContent='';subIdx=0;
}
function tic(){
  if(paused)return;t++;const sc=SCENES[si];
  while(subIdx<sc.subs.length&&t>=sc.subs[subIdx][0]){$('sub').textContent=sc.subs[subIdx][1];subIdx++;}
  const done=elapsedBefore+t;$('bar').style.width=Math.min(100,(done/totalDur)*100)+'%';
  if(t>=sc.dur){elapsedBefore+=sc.dur;si++;t=0;if(si>=SCENES.length){finir();return;}showScene();}
}
function togglePause(){paused=!paused;$('pauseBtn').textContent=paused?'▶ Lecture':'⏸ Pause';}
function finir(){
  clearInterval(timer);$('film').style.display='none';
  $('endtext').innerHTML="Astra est tombée, mais Nova approche du cœur du Cristal-Roi !<br>Le tir décisif va tout décider...<br>LE GRAND FINAL à l'épisode 10 ! 🚀⚡";
  $('end').classList.add('on');
}
</script>
